{id:31,mod:'m1',type:'MCQ',
q:'A drug that activates Gαq-coupled receptors would be MOST useful for which ONE of the following clinical applications?',
options:[
  {text:'Treatment of acute asthma to cause bronchodilation',correct:false,
   explain:'Bronchodilation requires Gαs activation (β₂ → ↑cAMP → relaxation). Gαq DOES THE OPPOSITE in bronchial smooth muscle (M₃ → ↑Ca²⁺ → contraction → bronchoconstriction). Activating Gαq in lungs would WORSEN asthma.'},
  {text:'Treatment of hypotension by causing vasoconstriction',correct:true,
   explain:'Vasoconstriction is mediated by Gαq-coupled α₁ adrenoceptors on vascular smooth muscle: α₁ → Gαq → PLC → IP₃ → Ca²⁺ release → contraction → ↑BP. Phenylephrine (α₁ agonist) is used IV for hypotension in shock and intra-operative settings.'},
  {text:'Treatment of bradycardia to increase heart rate',correct:false,
   explain:'Heart rate is controlled by Gαs (β₁ → ↑cAMP → ↑rate) or Gαi (M₂ → ↓cAMP → ↓rate) at the SA node. Gαq does not play a significant role in heart rate. Treating bradycardia = β₁ agonist (isoprenaline) or M₂ antagonist (atropine).'},
  {text:'Treatment of overactive bladder by causing detrusor relaxation',correct:false,
   explain:'OVERACTIVE bladder needs relaxation — Gαs (β₃ → mirabegron) or M₃ antagonism (oxybutynin). Gαq activation in detrusor would CONTRACT it → make overactive bladder WORSE.'}
],
memory:'Gαq → smooth muscle contraction. Used for: vasoconstriction (α₁), urinary retention (M₃ agonism). Avoid in: asthma, overactive bladder.',
exam:'Same Gαq produces vasoconstriction (good for hypotension) AND bronchoconstriction (bad in asthma) — tissue location determines clinical use.'},

{id:32,mod:'m2',type:'MCQ',
q:'Which ONE of the following amino acid residues is MOST important for the cation-π interaction in nAChR binding to nicotine?',
options:[
  {text:'Aspartate (Asp), which provides ionic bonding to the protonated nitrogen',correct:false,
   explain:'TRAP — Asp/Glu DO provide ionic bonding to cations (critical in many GPCRs), but the QUESTION asks about CATION-π specifically. Cation-π requires AROMATIC residues, not negatively charged ones. Asp is acidic/polar, not aromatic.'},
  {text:'Tryptophan (Trp149), which provides an aromatic indole ring for π-electron interaction',correct:true,
   explain:'The α subunit of nAChR has Trp149 in its agonist binding loop. The INDOLE ring of tryptophan has a delocalised π-electron system. The protonated nitrogen of nicotine (positive charge) interacts with this π-cloud via CATION-π interactions — one of the strongest non-covalent forces in biology. Other aromatic residues (Tyr93, Tyr190, Tyr197 in α subunit) also contribute. Site-directed mutagenesis of Trp149 dramatically reduces nicotine binding.'},
  {text:'Lysine (Lys), which forms hydrogen bonds to nicotine\'s pyridine ring',correct:false,
   explain:'Lysine has a positively charged amine — can H-bond donate but CANNOT do cation-π (no aromatic ring). Also, two positive charges (Lys and nicotine\'s N) would REPEL.'},
  {text:'Serine (Ser), which provides cation-π interactions through its hydroxyl group',correct:false,
   explain:'Serine\'s hydroxyl is polar but NOT aromatic — cannot do cation-π. Serine forms H-bonds (as donor or acceptor).'}
],
memory:'Cation-π = positive charge + aromatic ring. Trp, Tyr, Phe are the aromatic residues. Trp has the largest π system.',
exam:'The aromatic box in nAChR (Trp149, Tyr93, Tyr190, Tyr197) provides multiple cation-π interactions = exceptionally selective and high-affinity binding.'},

{id:33,mod:'m3',type:'MCQ',
q:'A patient with severe renal failure (eGFR 15 mL/min) is prescribed digoxin. Which ONE of the following is the MOST appropriate dosing approach?',
options:[
  {text:'Standard digoxin dose; renal impairment does not affect cardiac glycosides',correct:false,
   explain:'WRONG — digoxin is primarily renally excreted (~70% unchanged). Renal failure dramatically increases plasma levels and risk of toxicity (arrhythmias, GI upset, visual disturbances). Standard dosing → certain toxicity.'},
  {text:'Reduced digoxin dose AND therapeutic drug monitoring of plasma concentration',correct:true,
   explain:'Digoxin has: (1) Predominantly renal excretion → impaired clearance in renal failure. (2) Narrow therapeutic index (~0.8-2 ng/mL therapeutic, > 2 ng/mL toxic). (3) Large Vd (~7 L/kg) — requires loading dose to reach steady state. Approach: reduce maintenance dose (or extend interval) based on CrCl/eGFR; monitor plasma trough levels; assess clinically for toxicity.'},
  {text:'Switch to IV digoxin which bypasses the kidneys',correct:false,
   explain:'IV digoxin still goes through the kidneys for excretion — IV vs oral changes ABSORPTION (gut), not ELIMINATION (kidneys). All digoxin (oral or IV) is renally cleared.'},
  {text:'Add concurrent diuretic to enhance digoxin elimination',correct:false,
   explain:'DIURETICS WORSEN digoxin toxicity through electrolyte derangement: hypokalaemia → enhances digoxin binding to Na⁺/K⁺ ATPase → MORE toxic effect at same plasma level. Loop diuretics + digoxin = classic toxic combination.'}
],
memory:'Digoxin = renally excreted + narrow TI + needs TDM in renal failure. Diuretics worsen toxicity via hypokalaemia.',
exam:'For renally cleared drugs in CKD: reduce dose, extend interval, or both. Lithium, aminoglycosides, vancomycin, digoxin all need adjustment.'},

{id:34,mod:'m4',type:'MCQ',
q:'Which ONE of the following BEST describes the relationship between the LD₅₀ and therapeutic index?',
options:[
  {text:'Therapeutic index = LD₅₀ ÷ ED₅₀; a higher ratio indicates a wider safety margin',correct:true,
   explain:'Therapeutic Index (TI) = LD₅₀ / ED₅₀. LD₅₀ = dose lethal to 50% of test animals (or NOAEL in modern practice). ED₅₀ = dose effective in 50% of subjects. Higher TI = wider safety margin. Penicillin TI > 1000 (very safe). Digoxin TI ~2-3 (narrow). Warfarin, lithium, theophylline all have narrow TI requiring monitoring.'},
  {text:'LD₅₀ is the dose at which therapeutic effects emerge in 50% of patients',correct:false,
   explain:'LD₅₀ = LETHAL dose in 50% (in animals; ethically you cannot determine this in humans). ED₅₀ = effective dose in 50%. The question switches the definition of LD with ED.'},
  {text:'Therapeutic index = ED₅₀ ÷ LD₅₀; lower values indicate safer drugs',correct:false,
   explain:'BACKWARDS in two ways. (1) TI = LD₅₀/ED₅₀ (not the other way around). (2) Higher TI = safer (more gap between effect and death), not lower.'},
  {text:'A drug with TI = 100 is more dangerous than one with TI = 2',correct:false,
   explain:'OPPOSITE — TI = 100 means the lethal dose is 100× the effective dose (wide safety margin). TI = 2 means lethal dose is only 2× effective dose (narrow safety, requires TDM). Higher TI = safer.'}
],
memory:'TI = LD₅₀/ED₅₀. Higher = safer. Low TI drugs need TDM (digoxin, lithium, warfarin, theophylline, aminoglycosides).',
exam:'Modern preclinical: NOAEL replaces LD₅₀ (more ethical). Margin of safety = NOAEL/therapeutic exposure.'},

{id:35,mod:'m1',type:'MCQ',
q:'A drug causes a parallel rightward shift of the agonist CRC with no change in Emax. Adding a higher concentration of the same drug shifts the curve further right, also without changing Emax. The Schild plot has a slope of 1.0. Which ONE of the following BEST describes this drug?',
options:[
  {text:'A non-competitive irreversible antagonist',correct:false,
   explain:'Irreversible antagonists DEPRESS Emax — they cannot be overcome by more agonist. The question specifies Emax is preserved → not irreversible. Schild slope = 1 also only applies to competitive reversible antagonists.'},
  {text:'A competitive reversible antagonist',correct:true,
   explain:'All three findings point to competitive reversible antagonism: (1) Parallel RIGHTWARD shift = competitive (parallel because Hill slope unchanged). (2) Emax PRESERVED = reversible (overcome by more agonist). (3) Schild slope = 1.0 = pure orthosteric competition with no cooperativity. Textbook signature.'},
  {text:'An allosteric negative modulator (NAM)',correct:false,
   explain:'NAMs typically depress Emax (insurmountable) and give Schild slopes ≠ 1 (often < 1 for true allosteric effects). The findings do not match NAM behaviour.'},
  {text:'An inverse agonist at high concentrations',correct:false,
   explain:'Inverse agonists reduce constitutive activity below baseline — do not produce simple parallel CRC shifts in conventional analyses.'}
],
memory:'Competitive reversible: parallel right shift + preserved Emax + Schild slope = 1. Three-feature diagnosis.',
exam:'Dose-ratio (DR) = EC₅₀ in presence of antagonist / EC₅₀ without. Plot log(DR-1) vs log[antagonist]. Slope of 1 + pA₂ at x-intercept = competitive reversible.'},

{id:36,mod:'m3',type:'MCQ',
q:'A new drug has the following PK profile: oral F = 0.1, t½ = 18 h, Vd = 200 L. Which ONE of the following is MOST likely TRUE about this drug?',
options:[
  {text:'High first-pass metabolism is likely contributing to low oral bioavailability',correct:true,
   explain:'F = 0.1 (10%) is very low → only 10% of oral dose reaches systemic circulation. Causes: (1) Poor absorption (low solubility, P-gp efflux). (2) HIGH FIRST-PASS METABOLISM in gut or liver — common for high-clearance drugs (CYP3A4 substrates: simvastatin F = 5%, propranolol F = 25%, midazolam F = 36% orally). (3) Combination. Long t½ (18h) + large Vd (200 L) suggest tissue partitioning + moderate intrinsic clearance compensated by extensive distribution.'},
  {text:'The drug must have low protein binding because Vd is large',correct:false,
   explain:'OVERSIMPLIFIED — Large Vd CAN result from low protein binding allowing extensive tissue distribution, but can ALSO result from extensive tissue binding (despite high plasma protein binding). The relationship is nuanced.'},
  {text:'The drug will reach steady state within 24 hours',correct:false,
   explain:'Steady state requires ~5 half-lives. With t½ = 18 h, that is ~90 hours (4 days), NOT 24 hours. Loading dose can shortcut this.'},
  {text:'The drug is renally cleared because of large Vd',correct:false,
   explain:'Vd does not directly indicate renal vs hepatic clearance. Large Vd usually means LIPOPHILIC drug → more likely hepatically metabolised (CYP3A4) than renally excreted.'}
],
memory:'Low F + large Vd + moderate t½ = lipophilic CYP-metabolised drug with high first-pass. Typical CYP3A4 substrate profile.',
exam:'Steady state ≈ 5 half-lives. Loading dose = Css × Vd / F.'},

{id:37,mod:'m1',type:'MCQ',
q:'A patient is given pilocarpine eye drops for glaucoma. Which ONE of the following BEST explains how pilocarpine lowers intraocular pressure?',
options:[
  {text:'M₃ muscarinic agonism on iris sphincter and ciliary muscle, improving aqueous humour drainage',correct:true,
   explain:'Pilocarpine is a muscarinic agonist. At the EYE: (1) Iris sphincter: M₃ → Gαq → Ca²⁺ → contraction → MIOSIS (pupil constriction). (2) Ciliary muscle: M₃ → contraction → opens trabecular meshwork → improves aqueous humour DRAINAGE through Schlemm\'s canal → lowers IOP. β-blockers (timolol) work differently — reduce aqueous PRODUCTION.'},
  {text:'α₁ adrenergic agonism causing vasoconstriction of ciliary vessels and reduced aqueous production',correct:false,
   explain:'Pilocarpine is NOT an α agonist. Brimonidine (α₂ agonist) does reduce aqueous production but works via a different mechanism.'},
  {text:'β-adrenergic antagonism reducing aqueous humour production in ciliary body',correct:false,
   explain:'That describes TIMOLOL (β-blocker eye drops), not pilocarpine. Both lower IOP but by DIFFERENT mechanisms: pilocarpine ↑drainage; timolol ↓production.'},
  {text:'M₂ muscarinic antagonism on the heart, reducing ocular perfusion pressure',correct:false,
   explain:'Pilocarpine is an AGONIST, not antagonist. M₂ acts on heart, not eye. Lowering cardiac output to reduce ocular perfusion would be dangerous.'}
],
memory:'Pilocarpine = mAChR agonist = miosis + improved drainage = ↓IOP. Different mechanism from β-blockers.',
exam:'Acute angle-closure glaucoma is an OCULAR EMERGENCY. Atropine (mAChR ANTAGONIST) is CONTRAINDICATED in narrow-angle glaucoma — precipitates attack.'},

{id:38,mod:'m2',type:'MCQ',
q:'A drug company is developing a new mAChR M₁-selective agonist for Alzheimer\'s disease. Which ONE of the following design strategies would BEST achieve M₁ selectivity?',
options:[
  {text:'Increase molecular size to fit only the larger M₁ binding pocket',correct:false,
   explain:'mAChR subtypes (M₁-M₅) have very similar orthosteric binding pockets — size alone does not differentiate them well. This approach has historically FAILED to produce subtype-selective orthosteric agonists.'},
  {text:'Target an allosteric site that differs more between M₁ and M₂-M₅ subtypes',correct:true,
   explain:'KEY INSIGHT: orthosteric (ACh-binding) sites are highly conserved across M₁-M₅ → hard to get selectivity. ALLOSTERIC sites have MUCH more sequence divergence between subtypes. Targeting an allosteric site (as a PAM that potentiates only at M₁) gives better selectivity than competing with ACh at the orthosteric site. Major drug discovery strategy for mAChR subtype targeting.'},
  {text:'Make the drug irreversibly covalent so it does not dissociate from M₁',correct:false,
   explain:'Irreversible binding does not confer subtype selectivity — it just means the drug stays bound. If the drug binds M₁ AND M₂ similarly, irreversible binding to both does not solve the selectivity problem.'},
  {text:'Increase positive charge density on the molecule to exploit M₁\'s unique electrostatic profile',correct:false,
   explain:'All mAChR subtypes use the same conserved aspartate to bind the cationic ammonium of ACh. The orthosteric electrostatic environment is similar across subtypes.'}
],
memory:'Subtype selectivity is HARD at orthosteric sites (conserved). EASIER at allosteric sites (divergent). PAMs are increasingly used.',
exam:'Xanomeline (orthosteric M1/M4-preferring agonist) failed in clinical trials due to peripheral mAChR side effects. Modern approaches use M1 PAMs.'},

{id:39,mod:'m4',type:'MCQ',
q:'Which ONE of the following is the BEST justification for conducting reproductive toxicology studies across multiple generations?',
options:[
  {text:'To establish the LD₅₀ in pregnant animals',correct:false,
   explain:'LD₅₀ is determined in acute toxicology, not reproductive studies. Reproductive studies assess fertility, pregnancy outcomes, lactation, and developmental effects — not lethality endpoints.'},
  {text:'To detect transgenerational effects, including drug effects on F1 generation fertility and F2 outcomes',correct:true,
   explain:'Multi-generation studies: F0 (treated parents) → F1 (offspring of F0) → F2 (offspring of F1). Detects: (1) Effects on PARENT fertility (Segment I). (2) Embryotoxicity, teratogenicity in F1 (Segment II). (3) Pre- and postnatal development of F1, including their FERTILITY when they reach maturity, AND outcomes in F2 (Segment III). Catches transgenerational issues like DIETHYLSTILBESTROL (DES) where vaginal cancer occurred in F1 daughters of treated mothers — only detectable 20 years later in epidemiology.'},
  {text:'To allow drugs to be marketed without restriction during pregnancy',correct:false,
   explain:'OPPOSITE — comprehensive reproductive testing usually RESTRICTS marketing during pregnancy unless safety is robustly demonstrated.'},
  {text:'To replace clinical trials in pregnant women',correct:false,
   explain:'Pregnant women are usually EXCLUDED from clinical trials for ethical reasons. Animal reproductive tox informs but does not replace clinical experience.'}
],
memory:'Multi-generation reproductive tox = F0 → F1 → F2. Catches transgenerational effects that single-generation testing misses. DES is the cautionary tale.',
exam:'Thalidomide (1960s) was a pre-modern reproductive tox failure → led to current guidelines requiring rigorous teratogenicity testing in 2 species before pregnancy exposure.'},

{id:40,mod:'m3',type:'MCQ',
q:'A patient with chronic kidney disease (eGFR 25 mL/min) is being dosed with a drug that has 90% renal elimination of unchanged parent compound and a clearance of 10 L/h in healthy adults. The normal eGFR is 100 mL/min. Approximately what fraction of the standard dose should this patient receive?',
options:[
  {text:'Full dose — drug clearance is unaffected by kidney function',correct:false,
   explain:'Drug is 90% renally excreted → highly dependent on kidney function. Full dose in CKD → severe accumulation → toxicity. Renal dose adjustment is critical.'},
  {text:'Approximately 30% of normal dose, based on reduced renal clearance',correct:true,
   explain:'Use the formula: New CL = (1-f) × CL_normal + f × CL_normal × (eGFR_patient/eGFR_normal), where f = fraction renally excreted. = (1-0.9)(10) + (0.9)(10)(25/100) = 1 + 2.25 = 3.25 L/h. Ratio = 3.25/10 = 0.325 ≈ 30%. Give ~30% of normal dose to achieve similar exposure. Alternative: extend dose INTERVAL by 3-fold.'},
  {text:'Approximately 75% of normal dose',correct:false,
   explain:'Too high — would significantly overdose. eGFR is at 25% of normal AND 90% of drug is renally cleared. Most elimination is impaired.'},
  {text:'10% of normal dose because eGFR is 10% of normal',correct:false,
   explain:'Wrong arithmetic. eGFR is 25 mL/min (not 10), and 25/100 = 25%. Also, 10% of total elimination is non-renal — this remains intact.'}
],
memory:'CKD dose: new_CL = nonrenal_CL + renal_CL × (eGFR_pt/eGFR_normal). Adjust dose proportionally.',
exam:'For drugs with steep concentration-response: reduce dose, maintain interval. For aminoglycosides: extend interval to maintain peak/trough.'},

];

// ════════════════════════════════════════════════
// STATE + LOCALSTORAGE
// ════════════════════════════════════════════════
const STORE_KEY = 'pcol2021_mcq_v1';
let allCards = CARD_DEFS.map(c=>({...c,interval:0,ease:2.5,due:0,reps:0,lapses:0,correctCount:0,totalAttempts:0}));
let studyHistory={};
let currentStreak=0;
let lastStudiedDate=null;
let examDate=null;
let dailyNewLimit=15;
let dailyReviewLimit=80;
let theme='auto';
let todayNewSeen=0;
let todayReviewsSeen=0;
let lastDayReset=null;
let sessionCards=[], currentFilter='all', currentIdx=0;
let selectedOption=null;
let isRevealed=false;
let sessionStats={again:0,hard:0,good:0,easy:0,correct:0,total:0};

function loadState(){try{const r=localStorage.getItem(STORE_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify({cards:allCards.map(c=>({id:c.id,interval:c.interval,ease:c.ease,due:c.due,reps:c.reps,lapses:c.lapses,correctCount:c.correctCount,totalAttempts:c.totalAttempts})),history:studyHistory,streak:currentStreak,lastStudied:lastStudiedDate,examDate,dailyNewLimit,dailyReviewLimit,theme,todayNewSeen,todayReviewsSeen,lastDayReset}));}catch(e){console.error('Save failed',e);}}
function initState(){
  const s=loadState();
  if(s){const m={};(s.cards||[]).forEach(c=>{m[c.id]=c;});allCards=CARD_DEFS.map(d=>{const sv=m[d.id];return sv?{...d,...sv}:{...d};});studyHistory=s.history||{};currentStreak=s.streak||0;lastStudiedDate=s.lastStudied||null;examDate=s.examDate||null;dailyNewLimit=s.dailyNewLimit||15;dailyReviewLimit=s.dailyReviewLimit||80;theme=s.theme||'auto';todayNewSeen=s.todayNewSeen||0;todayReviewsSeen=s.todayReviewsSeen||0;lastDayReset=s.lastDayReset||null;}
  const today=todayStr();
  if(lastDayReset!==today){todayNewSeen=0;todayReviewsSeen=0;lastDayReset=today;saveState();}
}
function todayStr(){return new Date().toISOString().slice(0,10);}
function recordStudyDay(){const t=todayStr();studyHistory[t]=(studyHistory[t]||0)+1;if(lastStudiedDate===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.toISOString().slice(0,10);currentStreak=(lastStudiedDate===ys)?currentStreak+1:1;lastStudiedDate=t;}

function applyRating(card,score){
  const now=Date.now();
  if(score===1){card.lapses++;card.interval=Math.max(1,Math.round(card.interval*0.5));card.ease=Math.max(1.3,card.ease-0.2);card.due=now+60000;return 'requeue';}
  if(card.reps===0){if(score===2)card.interval=1;else if(score===3)card.interval=1;else if(score===4)card.interval=4;card.reps++;card.due=now+card.interval*86400000;return 'graduate';}
  if(score===2){card.interval=Math.max(1,Math.round(card.interval*1.2));card.ease=Math.max(1.3,card.ease-0.15);}
  else if(score===3){card.interval=Math.round(card.interval*card.ease);}
  else if(score===4){card.interval=Math.round(card.interval*card.ease*1.3);card.ease=Math.min(3.5,card.ease+0.15);}
  card.reps++;card.due=now+card.interval*86400000;return 'review';
}

function getDaysToExam(){if(!examDate)return null;const now=new Date();now.setHours(0,0,0,0);const exam=new Date(examDate);exam.setHours(0,0,0,0);return Math.ceil((exam-now)/86400000);}
function getRecommendedDailyNew(){if(!examDate)return dailyNewLimit;const days=getDaysToExam();if(days<=0)return 0;const u=allCards.filter(c=>c.reps===0).length;if(u===0)return 0;const ld=Math.max(1,days-7);return Math.ceil(u/ld);}
function getFiltered(){return allCards.filter(c=>currentFilter==='all'||c.mod===currentFilter);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function buildSession(dueOnly=false){
  const now=Date.now(),f=getFiltered();
  let due=f.filter(c=>c.reps>0&&c.due<=now);shuffle(due);
  const reviewsLeft=Math.max(0,dailyReviewLimit-todayReviewsSeen);
  due=due.slice(0,reviewsLeft);
  if(dueOnly){sessionCards=due;}
  else{let nw=f.filter(c=>c.reps===0);shuffle(nw);const targetNew=examDate?Math.min(getRecommendedDailyNew(),dailyNewLimit):dailyNewLimit;const newLeft=Math.max(0,targetNew-todayNewSeen);nw=nw.slice(0,newLeft);sessionCards=[...due,...nw];}
  currentIdx=0;sessionStats={again:0,hard:0,good:0,easy:0,correct:0,total:0};
}

function calcIntervals(c){const d=ms=>{if(ms<60000)return '<1m';if(ms<3600000)return Math.round(ms/60000)+'m';if(ms<86400000)return Math.round(ms/3600000)+'h';return Math.round(ms/86400000)+'d';};const sim=score=>{const tmp={...c};applyRating(tmp,score);return tmp.due-Date.now();};return{again:d(sim(1)),hard:d(sim(2)),good:d(sim(3)),easy:d(sim(4))};}

const MOD_LABELS={m1:'M1 PD',m2:'M2 MolPharm',m3:'M3 PK',m4:'M4 DrugDev'};
const LETTERS=['A','B','C','D'];

function showCard(){
  if(currentIdx>=sessionCards.length){showFinished();return;}
  const c=sessionCards[currentIdx];isRevealed=false;selectedOption=null;
  const now=Date.now();const isNew=c.reps===0;
  let db=isNew?'<span class="due-badge" style="color:var(--m2);border-color:rgba(176,122,255,.3);background:rgba(176,122,255,.06);">✨ New</span>':(c.due<=now?'<span class="due-badge" style="color:var(--hard);border-color:rgba(240,192,64,.3);background:rgba(240,192,64,.06);">🔄 Review</span>':'<span class="due-badge" style="color:var(--m1);border-color:rgba(91,200,245,.3);background:rgba(91,200,245,.06);">📖 Learning</span>');
  document.getElementById('card-meta').innerHTML=`<span class="module-badge badge-${c.mod}">${MOD_LABELS[c.mod]}</span>${db}<span class="card-num">${currentIdx+1}/${sessionCards.length}</span>`;
  const fc=document.getElementById('flashcard');fc.className='flashcard '+c.mod;fc.classList.remove('revealed');
  document.getElementById('q-text').innerHTML=c.q;
  const optsEl=document.getElementById('options');optsEl.innerHTML='';
  c.options.forEach((opt,idx)=>{
    const div=document.createElement('div');div.className='option';div.dataset.idx=idx;
    div.onclick=()=>selectOption(idx);
    div.innerHTML=`<span class="option-letter">${LETTERS[idx]}</span><span class="option-text">${opt.text}</span><span class="option-mark"></span>`;
    optsEl.appendChild(div);
  });
  document.getElementById('submit-btn').classList.remove('active');
  document.getElementById('expl-body').innerHTML='';document.getElementById('card-memory').innerHTML='';document.getElementById('card-exam').innerHTML='';
  const iv=calcIntervals(c);
  document.getElementById('next-again').textContent=iv.again;document.getElementById('next-hard').textContent=iv.hard;document.getElementById('next-good').textContent=iv.good;document.getElementById('next-easy').textContent=iv.easy;
  updateTopStats();
}

function selectOption(idx){if(isRevealed)return;selectedOption=idx;document.querySelectorAll('.option').forEach((el,i)=>{el.classList.toggle('selected',i===idx);});document.getElementById('submit-btn').classList.add('active');}

function submitAnswer(){
  if(selectedOption===null||isRevealed)return;isRevealed=true;
  const c=sessionCards[currentIdx];const wasCorrect=c.options[selectedOption].correct;
  c.totalAttempts++;if(wasCorrect)c.correctCount++;
  document.querySelectorAll('.option').forEach((el,i)=>{el.classList.remove('selected');if(c.options[i].correct){el.classList.add('correct');el.querySelector('.option-mark').textContent='✓';}else if(i===selectedOption){el.classList.add('wrong');el.querySelector('.option-mark').textContent='✗';}});
  let html='';
  c.options.forEach((opt,i)=>{if(opt.correct){html+=`<div class="expl-correct"><strong>${LETTERS[i]} — CORRECT:</strong> ${opt.explain}</div>`;}else{html+=`<div class="expl-wrong"><strong>${LETTERS[i]} — Wrong:</strong> ${opt.explain}</div>`;}});
  document.getElementById('expl-body').innerHTML=html;
  document.getElementById('card-memory').innerHTML=c.memory?`<div class="memory-hook">${c.memory}</div>`:'';
  document.getElementById('card-exam').innerHTML=c.exam?`<div class="exam-flag">${c.exam}</div>`:'';
  document.getElementById('flashcard').classList.add('revealed');
  sessionStats.total++;if(wasCorrect)sessionStats.correct++;
}

function rate(score){
  if(!isRevealed)return;
  const c=sessionCards[currentIdx];const wasNew=c.reps===0;const result=applyRating(c,score);
  if(wasNew&&result!=='requeue')todayNewSeen++;else if(!wasNew)todayReviewsSeen++;
  if(result==='requeue')sessionCards.push({...c});
  const idx=allCards.findIndex(x=>x.id===c.id);
  if(idx>-1)Object.assign(allCards[idx],{interval:c.interval,ease:c.ease,due:c.due,reps:c.reps,lapses:c.lapses,correctCount:c.correctCount,totalAttempts:c.totalAttempts});
  sessionStats[{1:'again',2:'hard',3:'good',4:'easy'}[score]]++;
  recordStudyDay();saveState();renderHistory();updateStreak();
  currentIdx++;showCard();
}

function showFinished(){
  document.getElementById('card-wrap').style.display='none';
  const f=document.getElementById('finished');f.style.display='block';
  const s=sessionStats;const total=s.again+s.hard+s.good+s.easy;
  const accuracy=s.total>0?Math.round((s.correct/s.total)*100):0;
  document.getElementById('finished-msg').innerHTML=total===0?'No cards due right now. Great job!':`You completed ${total} cards.${examDate?'<br>'+getDaysToExam()+' days to exam.':''}`;
  document.getElementById('accuracy-box').innerHTML=s.total>0?`Accuracy: <strong>${s.correct}/${s.total}</strong> (${accuracy}%)`:'';
  document.getElementById('review-summary').innerHTML=`<span class="summary-chip" style="border-color:rgba(240,106,106,.4);color:var(--again);">Again: ${s.again}</span><span class="summary-chip" style="border-color:rgba(240,192,64,.4);color:var(--hard);">Hard: ${s.hard}</span><span class="summary-chip" style="border-color:rgba(91,200,245,.4);color:var(--good);">Good: ${s.good}</span><span class="summary-chip" style="border-color:rgba(62,207,142,.4);color:var(--easy);">Easy: ${s.easy}</span>`;
  updateTopStats();
}

function restart(){document.getElementById('card-wrap').style.display='flex';document.getElementById('finished').style.display='none';buildSession(false);showCard();}
function restartDue(){document.getElementById('card-wrap').style.display='flex';document.getElementById('finished').style.display='none';buildSession(true);if(sessionCards.length===0)showFinished();else showCard();}
function setFilter(f){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.filter-btn.${f}`).classList.add('active');restart();}

function updateTopStats(){
  const f=getFiltered(),now=Date.now();
  document.getElementById('stat-new').textContent=f.filter(c=>c.reps===0).length+' new';
  document.getElementById('stat-review').textContent=f.filter(c=>c.reps>0&&c.due<=now).length+' due';
  document.getElementById('stat-done').textContent=f.filter(c=>c.reps>0&&c.due>now).length+' learned';
  const ed=getDaysToExam();const ee=document.getElementById('stat-exam-days');
  if(ed!==null){if(ed>0)ee.textContent=ed+' days to exam';else if(ed===0)ee.textContent='Exam today! 🎯';else ee.textContent='Exam passed';}else ee.textContent='Set exam date';
  const pct=sessionCards.length>0?((currentIdx/sessionCards.length)*100):0;document.getElementById('progress').style.width=pct+'%';
}
function updateStreak(){document.getElementById('stat-streak').textContent=currentStreak+' streak 🔥';}

function renderHistory(){
  const g=document.getElementById('history-grid');g.innerHTML='';const t=todayStr();let total=0;
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const cnt=studyHistory[ds]||0;total+=cnt;let cl='dot-empty',lbl='';if(cnt>0&&cnt<5){cl='dot-low';lbl=cnt;}else if(cnt>=5&&cnt<15){cl='dot-med';lbl=cnt;}else if(cnt>=15){cl='dot-high';lbl=cnt;}g.innerHTML+=`<div class="history-dot ${cl}${ds===t?' dot-today':''}" title="${ds}: ${cnt} cards">${lbl}</div>`;}
  document.getElementById('history-total').textContent=`${total} cards`;
}

function openSettings(){document.getElementById('modal-settings').classList.add('open');document.getElementById('exam-date').value=examDate||'';document.getElementById('daily-new').value=dailyNewLimit;document.getElementById('daily-review').value=dailyReviewLimit;updateThemeButtons();updateCountdown();}
function closeSettings(){document.getElementById('modal-settings').classList.remove('open');}
function setExamDate(d){examDate=d;saveState();updateCountdown();updateTopStats();}
function updateCountdown(){
  const days=getDaysToExam();const dEl=document.getElementById('countdown-days');const lEl=document.getElementById('countdown-label');const recBox=document.getElementById('recommend-box');
  if(days===null){dEl.textContent='—';lEl.textContent='Set your exam date';recBox.style.display='none';return;}
  dEl.textContent=days>0?days:(days===0?'!':'⏰');
  lEl.textContent=days>0?`days until ${new Date(examDate).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}`:(days===0?'Exam today!':'Exam passed');
  if(days>0){const newRemaining=allCards.filter(c=>c.reps===0).length;const rec=getRecommendedDailyNew();const learningDays=Math.max(1,days-7);recBox.style.display='block';recBox.innerHTML=newRemaining>0?`📚 Study <strong>~${rec} new cards/day</strong> for the next ${learningDays} days to cover all ${newRemaining} unstudied cards. Last 7 days = review only.`:`✅ All cards started. Use ${days} days for spaced repetition.`;}else recBox.style.display='none';
}
function setDailyLimit(t,v){if(t==='new')dailyNewLimit=parseInt(v);else dailyReviewLimit=parseInt(v);saveState();updateTopStats();}
function setTheme(t){theme=t;applyTheme();updateThemeButtons();saveState();}
function applyTheme(){let actual=theme;if(theme==='auto')actual=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',actual);document.querySelector('meta[name="theme-color"]').setAttribute('content',actual==='dark'?'#5bc8f5':'#0e7eb8');}
function updateThemeButtons(){document.querySelectorAll('.theme-toggle button').forEach(b=>b.classList.remove('active'));const btn=document.getElementById('theme-'+theme);if(btn)btn.classList.add('active');}
function toggleTheme(){const order=['dark','light','auto'];const i=order.indexOf(theme);setTheme(order[(i+1)%3]);}
function exportData(){const data=loadState();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`pcol2021-mcq-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);}
function importData(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);localStorage.setItem(STORE_KEY,JSON.stringify(data));location.reload();}catch(err){alert('Import failed: invalid file');}};reader.readAsText(file);}
function resetAll(){localStorage.removeItem(STORE_KEY);location.reload();}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(!isRevealed){if(e.key>='1'&&e.key<='4'){const idx=parseInt(e.key)-1;const c=sessionCards[currentIdx];if(c&&idx<c.options.length)selectOption(idx);}if(e.code==='Enter'||e.code==='Space'){e.preventDefault();if(selectedOption!==null)submitAnswer();}}
  else{if(e.key==='1')rate(1);if(e.key==='2')rate(2);if(e.key==='3')rate(3);if(e.key==='4')rate(4);}
});

window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(theme==='auto')applyTheme();});

function checkInstallHint(){const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);const isStandalone=window.navigator.standalone===true;const dismissed=localStorage.getItem('install_hint_dismissed');if(isIOS&&!isStandalone&&!dismissed){setTimeout(()=>{document.getElementById('install-hint').classList.add('show');document.querySelector('#install-hint .close').addEventListener('click',()=>{localStorage.setItem('install_hint_dismissed','1');});},3000);}}

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(r=>console.log('SW registered'),e=>console.log('SW failed',e));});}

initState();applyTheme();renderHistory();updateStreak();buildSession(false);showCard();checkInstallHint();
</script>
