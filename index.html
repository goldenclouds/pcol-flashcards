<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5bc8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PCOL2021">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PCOL2021 Flashcards — MCQ</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#0c0e14;--surface:#13161e;--surface2:#1a1e29;--border:#252a38;
    --text:#e2e6f0;--muted:#6e7590;--dim:#3a3f52;
    --m1:#5bc8f5;--m2:#b07aff;--m3:#5ee8b0;--m4:#f97060;
    --easy:#3ecf8e;--good:#5bc8f5;--hard:#f0c040;--again:#f06a6a;
    --correct:#3ecf8e;--wrong:#f06a6a;
    --shadow:0 4px 20px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#f7f5f0;--surface:#ffffff;--surface2:#f0ede6;--border:#e2ddd4;
    --text:#1c1a16;--muted:#5a5550;--dim:#9a9590;
    --m1:#0e7eb8;--m2:#7541b8;--m3:#1a8a52;--m4:#c44d3a;
    --easy:#1a8a52;--good:#0e7eb8;--hard:#a86e0a;--again:#c44d3a;
    --correct:#1a8a52;--wrong:#c44d3a;
    --shadow:0 4px 20px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text);font-family:'Lora',serif;display:flex;flex-direction:column;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  .safe-top{padding-top:env(safe-area-inset-top);}
  .safe-bottom{padding-bottom:env(safe-area-inset-bottom);}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  header h1{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  header h1 span{color:var(--m1);}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;transition:all .15s;}
  .icon-btn:hover,.icon-btn:active{background:var(--surface2);color:var(--text);}
  .stats-strip{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:6px 12px;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0;}
  .stats-strip::-webkit-scrollbar{display:none;}
  .stat{font-family:'DM Mono',monospace;font-size:10px;padding:5px 11px;border-radius:18px;border:1px solid var(--border);white-space:nowrap;display:flex;align-items:center;gap:5px;}
  .stat-new{border-color:rgba(91,200,245,.4);color:var(--m1);}
  .stat-review{border-color:rgba(176,122,255,.4);color:var(--m2);}
  .stat-done{border-color:rgba(94,232,176,.45);color:var(--m3);}
  .stat-streak{border-color:rgba(249,112,96,.4);color:var(--m4);}
  .stat-exam{background:rgba(240,106,106,.08);border-color:rgba(240,106,106,.5);color:var(--m4);font-weight:600;}
  .filters{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:9px 12px;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0;}
  .filters::-webkit-scrollbar{display:none;}
  .filter-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
  .filter-btn.active.all{background:var(--text);color:var(--bg);border-color:var(--text);}
  .filter-btn.active.m1{background:rgba(91,200,245,.15);border-color:var(--m1);color:var(--m1);}
  .filter-btn.active.m2{background:rgba(176,122,255,.15);border-color:var(--m2);color:var(--m2);}
  .filter-btn.active.m3{background:rgba(94,232,176,.15);border-color:var(--m3);color:var(--m3);}
  .filter-btn.active.m4{background:rgba(249,112,96,.15);border-color:var(--m4);color:var(--m4);}
  .progress-wrap{height:3px;background:var(--border);flex-shrink:0;}
  .progress-bar{height:3px;background:linear-gradient(90deg,var(--m1),var(--m2));transition:width .4s ease;}
  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:14px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .card-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;}
  .card-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;font-size:10px;}
  .module-badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:14px;}
  .badge-m1{background:rgba(91,200,245,.12);border:1px solid rgba(91,200,245,.3);color:var(--m1);}
  .badge-m2{background:rgba(176,122,255,.12);border:1px solid rgba(176,122,255,.3);color:var(--m2);}
  .badge-m3{background:rgba(94,232,176,.12);border:1px solid rgba(94,232,176,.3);color:var(--m3);}
  .badge-m4{background:rgba(249,112,96,.12);border:1px solid rgba(249,112,96,.3);color:var(--m4);}
  .due-badge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);}
  .card-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-left:auto;}
  .flashcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .flashcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
  .flashcard.m1::before{background:var(--m1);}
  .flashcard.m2::before{background:var(--m2);}
  .flashcard.m3::before{background:var(--m3);}
  .flashcard.m4::before{background:var(--m4);}
  
  /* Stem (question) */
  .q-stem{padding:20px 22px 12px;}
  .q-text{font-family:'Syne',sans-serif;font-size:16px;font-weight:600;line-height:1.5;color:var(--text);}
  .q-text em{color:var(--m1);font-style:normal;font-weight:700;}
  
  /* Options */
  .options{padding:6px 14px 14px;display:flex;flex-direction:column;gap:7px;}
  .option{padding:11px 14px;border:1px solid var(--border);border-radius:9px;background:var(--bg);cursor:pointer;font-size:13.5px;line-height:1.55;color:var(--text);display:flex;gap:10px;align-items:flex-start;transition:all .15s;}
  .option:hover{border-color:var(--muted);}
  .option.selected{border-color:var(--m1);background:rgba(91,200,245,.06);}
  .option.correct{border-color:var(--correct);background:rgba(62,207,142,.1);}
  .option.wrong{border-color:var(--wrong);background:rgba(240,106,106,.08);}
  .option-letter{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);min-width:18px;flex-shrink:0;margin-top:1px;}
  .option.correct .option-letter{color:var(--correct);}
  .option.wrong .option-letter{color:var(--wrong);}
  .option-text{flex:1;}
  .option-mark{font-size:14px;flex-shrink:0;}
  
  /* Explanation panel */
  .explanation{display:none;border-top:1px solid var(--border);background:var(--surface2);padding:16px 22px;}
  .flashcard.revealed .explanation{display:block;}
  .expl-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .expl-body{font-size:13.5px;line-height:1.8;color:var(--text);}
  .expl-body strong{color:var(--text);font-weight:600;}
  [data-theme="dark"] .expl-body strong{color:#fff;}
  .expl-body em{color:var(--m1);font-style:normal;font-weight:600;}
  .expl-correct{background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.25);border-radius:7px;padding:10px 13px;margin-top:10px;font-size:13px;line-height:1.7;color:var(--correct);}
  .expl-correct strong{color:var(--correct);}
  .expl-wrong{background:rgba(240,106,106,.06);border:1px solid rgba(240,106,106,.2);border-radius:7px;padding:9px 13px;margin-top:8px;font-size:12.5px;line-height:1.65;color:var(--muted);}
  .expl-wrong strong{color:var(--wrong);}
  .memory-hook{margin-top:12px;background:rgba(176,122,255,.07);border:1px solid rgba(176,122,255,.22);border-radius:7px;padding:10px 13px;font-size:12.5px;color:var(--m2);line-height:1.65;}
  .memory-hook::before{content:'🧠  ';}
  .exam-flag{margin-top:8px;background:rgba(240,192,64,.08);border:1px solid rgba(240,192,64,.25);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--hard);font-family:'DM Mono',monospace;line-height:1.6;}
  .exam-flag::before{content:'⚠️ TRAP: ';font-weight:700;}
  
  /* Rating buttons */
  .rating-wrap{display:none;gap:6px;padding:0 14px 14px;}
  .flashcard.revealed .rating-wrap{display:flex;}
  .rating-btn{flex:1;padding:11px 4px;border-radius:9px;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;text-align:center;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .rating-btn:active{transform:scale(.96);}
  .btn-again{background:rgba(240,106,106,.12);color:var(--again);border:1px solid rgba(240,106,106,.3);}
  .btn-hard{background:rgba(240,192,64,.1);color:var(--hard);border:1px solid rgba(240,192,64,.28);}
  .btn-good{background:rgba(91,200,245,.1);color:var(--good);border:1px solid rgba(91,200,245,.28);}
  .btn-easy{background:rgba(62,207,142,.1);color:var(--easy);border:1px solid rgba(62,207,142,.28);}
  .rating-label{font-size:9px;opacity:.7;}
  .rating-next{font-size:8px;opacity:.5;}
  
  .submit-bar{display:none;padding:0 14px 14px;}
  .flashcard:not(.revealed) .submit-bar{display:block;}
  .submit-btn{width:100%;padding:11px;border-radius:9px;border:none;background:var(--m1);color:var(--bg);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;opacity:.5;transition:opacity .15s;}
  .submit-btn.active{opacity:1;}
  
  .finished{text-align:center;padding:40px 24px;display:none;}
  .finished h2{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--text);margin-bottom:6px;}
  .finished p{color:var(--muted);font-size:13px;line-height:1.6;max-width:380px;margin:0 auto 22px;}
  .review-summary{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
  .summary-chip{font-family:'DM Mono',monospace;font-size:11px;padding:5px 12px;border-radius:7px;border:1px solid var(--border);}
  .accuracy-box{font-family:'DM Mono',monospace;font-size:14px;padding:12px 18px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);color:var(--text);margin-bottom:18px;display:inline-block;}
  .btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .restart-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:11px 22px;border-radius:8px;border:none;background:var(--m1);color:var(--bg);cursor:pointer;font-weight:600;}
  .restart-due-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:11px 22px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s;}
  .modal-backdrop.open{display:flex;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:slideUp .25s;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:-8px auto 16px;}
  .modal h2{font-family:'Syne',sans-serif;font-size:20px;color:var(--text);margin-bottom:18px;}
  .modal-section{margin-bottom:20px;}
  .modal-section h3{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
  .modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
  .modal-row label{font-size:14px;color:var(--text);flex:1;}
  .modal-row input[type="date"],.modal-row input[type="number"]{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 11px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;}
  .modal-row input[type="date"]{color-scheme:dark;}
  [data-theme="light"] .modal-row input[type="date"]{color-scheme:light;}
  .modal-row input[type="number"]{width:80px;text-align:center;}
  .countdown-box{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:14px;margin-top:10px;text-align:center;}
  .countdown-days{font-family:'DM Mono',monospace;font-size:32px;font-weight:700;color:var(--m4);margin-bottom:4px;}
  .countdown-label{font-size:12px;color:var(--muted);}
  .recommend-box{background:rgba(91,200,245,.08);border:1px solid rgba(91,200,245,.3);border-radius:7px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--m1);line-height:1.6;}
  .modal-btn{display:block;width:100%;padding:12px;background:var(--m1);color:var(--bg);border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:8px;}
  .modal-btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .theme-toggle{display:flex;background:var(--surface2);border-radius:8px;padding:3px;}
  .theme-toggle button{flex:1;padding:8px;background:transparent;border:none;border-radius:6px;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;}
  .theme-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1);}
  .history-panel{background:var(--surface);border-top:1px solid var(--border);padding:8px 12px 10px;flex-shrink:0;}
  .history-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .history-grid{display:flex;gap:3px;justify-content:space-between;}
  .history-dot{flex:1;min-width:0;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;font-weight:600;}
  .dot-empty{background:var(--surface2);border:1px solid var(--border);color:var(--dim);}
  .dot-low{background:rgba(94,232,176,.15);border:1px solid rgba(94,232,176,.3);color:var(--m3);}
  .dot-med{background:rgba(94,232,176,.3);border:1px solid rgba(94,232,176,.5);color:var(--m3);}
  .dot-high{background:rgba(94,232,176,.55);border:1px solid var(--m3);color:#fff;}
  .dot-today{outline:2px solid var(--m1);outline-offset:1px;}
  .install-hint{position:fixed;bottom:20px;left:12px;right:12px;background:var(--surface);border:1px solid var(--m1);border-radius:12px;padding:12px 16px;display:none;z-index:500;font-size:12px;box-shadow:var(--shadow);animation:slideUp .3s;}
  .install-hint.show{display:block;}
  .install-hint strong{color:var(--m1);}
  .install-hint .close{float:right;background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 0 0 8px;}
</style>
</head>
<body>
<div class="safe-top">
<header>
  <h1>PCOL <span>MCQ</span></h1>
  <button class="icon-btn" onclick="openSettings()">⚙️</button>
  <button class="icon-btn" onclick="toggleTheme()">🌓</button>
</header>
<div class="stats-strip">
  <span class="stat stat-exam" id="stat-exam-days">— days to exam</span>
  <span class="stat stat-new" id="stat-new">— new</span>
  <span class="stat stat-review" id="stat-review">— due</span>
  <span class="stat stat-done" id="stat-done">— learned</span>
  <span class="stat stat-streak" id="stat-streak">— streak 🔥</span>
</div>
<div class="filters">
  <button class="filter-btn active all" onclick="setFilter('all')">All</button>
  <button class="filter-btn m1" onclick="setFilter('m1')">M1 PD</button>
  <button class="filter-btn m2" onclick="setFilter('m2')">M2 MolPharm</button>
  <button class="filter-btn m3" onclick="setFilter('m3')">M3 PK</button>
  <button class="filter-btn m4" onclick="setFilter('m4')">M4 DrugDev</button>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progress" style="width:0%"></div></div>
</div>
<main>
  <div class="card-wrap" id="card-wrap">
    <div class="card-meta" id="card-meta"></div>
    <div class="flashcard" id="flashcard">
      <div class="q-stem"><div class="q-text" id="q-text"></div></div>
      <div class="options" id="options"></div>
      <div class="submit-bar"><button class="submit-btn" id="submit-btn" onclick="submitAnswer()">Submit Answer</button></div>
      <div class="explanation">
        <div class="expl-label">Explanation</div>
        <div class="expl-body" id="expl-body"></div>
        <div id="card-memory"></div>
        <div id="card-exam"></div>
      </div>
      <div class="rating-wrap">
        <button class="rating-btn btn-again" onclick="rate(1)">Again<span class="rating-label">Wrong</span><span class="rating-next" id="next-again"></span></button>
        <button class="rating-btn btn-hard" onclick="rate(2)">Hard<span class="rating-label">Struggled</span><span class="rating-next" id="next-hard"></span></button>
        <button class="rating-btn btn-good" onclick="rate(3)">Good<span class="rating-label">Got it</span><span class="rating-next" id="next-good"></span></button>
        <button class="rating-btn btn-easy" onclick="rate(4)">Easy<span class="rating-label">Nailed it</span><span class="rating-next" id="next-easy"></span></button>
      </div>
    </div>
  </div>
  <div class="finished" id="finished">
    <h2>Session Complete 🎉</h2>
    <p id="finished-msg">All cards reviewed.</p>
    <div class="accuracy-box" id="accuracy-box"></div>
    <div class="review-summary" id="review-summary"></div>
    <div class="btn-row">
      <button class="restart-due-btn" onclick="restartDue()">Due Only</button>
      <button class="restart-btn" onclick="restart()">Study All</button>
    </div>
  </div>
</main>
<div class="history-panel safe-bottom">
  <div class="history-title"><span>Last 14 days</span><span id="history-total">0 cards</span></div>
  <div class="history-grid" id="history-grid"></div>
</div>
<div class="modal-backdrop" id="modal-settings" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Settings</h2>
    <div class="modal-section"><h3>Theme</h3>
      <div class="theme-toggle">
        <button id="theme-light" onclick="setTheme('light')">☀️ Light</button>
        <button id="theme-dark" onclick="setTheme('dark')">🌙 Dark</button>
        <button id="theme-auto" onclick="setTheme('auto')">⚙️ Auto</button>
      </div></div>
    <div class="modal-section"><h3>Exam Date</h3>
      <div class="modal-row"><label for="exam-date">Date to learn everything by:</label><input type="date" id="exam-date" onchange="setExamDate(this.value)"></div>
      <div class="countdown-box"><div class="countdown-days" id="countdown-days">—</div><div class="countdown-label" id="countdown-label">Set your exam date</div></div>
      <div class="recommend-box" id="recommend-box" style="display:none;"></div></div>
    <div class="modal-section"><h3>Daily Limits</h3>
      <div class="modal-row"><label>New cards per day</label><input type="number" id="daily-new" min="1" max="50" value="15" onchange="setDailyLimit('new',this.value)"></div>
      <div class="modal-row"><label>Max reviews per day</label><input type="number" id="daily-review" min="10" max="200" value="80" onchange="setDailyLimit('review',this.value)"></div></div>
    <div class="modal-section"><h3>Data</h3>
      <button class="modal-btn modal-btn-secondary" onclick="exportData()">Export Progress (Backup)</button>
      <button class="modal-btn modal-btn-secondary" onclick="document.getElementById('import-input').click()">Import Progress</button>
      <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">
      <button class="modal-btn modal-btn-secondary" onclick="if(confirm('Reset all progress? This cannot be undone.')) resetAll()" style="color:var(--again);border-color:rgba(240,106,106,.3);">Reset All Progress</button></div>
    <button class="modal-btn" onclick="closeSettings()">Done</button>
  </div>

{id:1,mod:'m1',type:'MCQ',
q:'A 65-year-old asthmatic with new-onset hypertension is prescribed propranolol. Within hours she develops severe wheeze requiring nebulised salbutamol. Which ONE of the following BEST explains why propranolol was contraindicated in this patient?',
options:[
  {text:'Propranolol acts as a partial agonist at β₂ adrenoceptors, displacing endogenous adrenaline and causing bronchoconstriction',correct:false,
   explain:'Propranolol is a competitive ANTAGONIST at β receptors, not a partial agonist. The mechanism described is incorrect — though the clinical outcome (bronchoconstriction) is right.'},
  {text:'Propranolol blocks β₂ adrenoceptors on bronchial smooth muscle, preventing physiological antagonism of vagal M₃-mediated bronchoconstriction',correct:true,
   explain:'Propranolol is non-selective (blocks β₁ AND β₂). In healthy airways, baseline vagal tone produces some M₃-mediated bronchoconstriction; this is opposed by circulating adrenaline acting on β₂ (PHYSIOLOGICAL ANTAGONISM). Blocking β₂ removes this protection → bronchoconstriction. Salbutamol (β₂ agonist) reverses it.'},
  {text:'Propranolol is a non-selective α-adrenoceptor antagonist that causes reflex vagal stimulation',correct:false,
   explain:'Propranolol is a β-blocker, NOT an α-blocker. This option confuses receptor classes entirely.'},
  {text:'Propranolol increases sensitivity of M₃ muscarinic receptors via Gαq upregulation',correct:false,
   explain:'No such mechanism exists. Propranolol does not affect muscarinic receptor expression or coupling. Distractor designed to test recall of MAChR subtypes.'}
],
memory:'Non-selective β blocker + asthma = disaster. Always check for asthma history before prescribing propranolol.',
exam:'Use β₁-selective blockers (atenolol, metoprolol) in patients with airway disease — they minimise β₂ blockade.'},

{id:2,mod:'m1',type:'MCQ',
q:'Drug X produces 80% of the maximal response of drug Y at the same receptor. Both drugs have identical EC₅₀ values. Which ONE of the following BEST describes drug X?',
options:[
  {text:'Drug X is a full agonist with lower potency than drug Y',correct:false,
   explain:'A full agonist by definition produces 100% of the maximal response. Drug X only achieves 80% → it CANNOT be a full agonist. Also, identical EC₅₀ means identical potency, not lower.'},
  {text:'Drug X is a partial agonist with the same potency as drug Y',correct:true,
   explain:'80% maximal response (Emax) = α between 0 and 1 → partial agonist by definition. Identical EC₅₀ values mean identical potency. Intrinsic activity (α) and potency (EC₅₀) are INDEPENDENT properties.'},
  {text:'Drug X is a competitive antagonist with positive intrinsic activity',correct:false,
   explain:'A competitive antagonist has α = 0 (no intrinsic activity). The statement "antagonist with positive intrinsic activity" is contradictory.'},
  {text:'Drug X is an inverse agonist with reduced affinity',correct:false,
   explain:'Inverse agonists produce a response BELOW baseline (negative α). They do not produce 80% of maximum — that is a partial agonist.'}
],
memory:'Potency (EC₅₀) ≠ Efficacy (Emax). Same EC₅₀ + lower Emax = partial agonist with equal potency.',
exam:'EC₅₀ measures the concentration needed for half-maximal response. Emax measures the ceiling. They tell you completely different things.'},

{id:3,mod:'m1',type:'MCQ',
q:'In a tissue with significant spare receptors, drug A occupies 25% of receptors and produces the maximal response. Drug B occupies 100% of receptors and produces 50% of the maximal response. Which ONE of the following is CORRECT?',
options:[
  {text:'Drug A has lower intrinsic efficacy than drug B because it occupies fewer receptors',correct:false,
   explain:'OPPOSITE of correct. Drug A produces maximal response by occupying only 25% of receptors → very high efficacy. Drug B occupies 100% but only reaches 50% Emax → lower efficacy.'},
  {text:'Drug B is a full agonist with low affinity',correct:false,
   explain:'Drug B cannot be a full agonist because it never reaches 100% Emax even at full receptor occupancy. It is a partial agonist with high affinity (since it occupies all receptors).'},
  {text:'Drug A is a high-efficacy agonist; drug B is a partial agonist',correct:true,
   explain:'Spare receptor theory: when a tissue has spare receptors, a high-efficacy agonist only needs to occupy a fraction to reach Emax. Drug A achieves max at 25% occupancy → high efficacy. Drug B fails to reach max even at 100% occupancy → partial agonist (low intrinsic activity).'},
  {text:'Both drugs must have identical Kd values because they bind the same receptor',correct:false,
   explain:'Different drugs binding the same receptor can have completely different Kd (affinity) values. Affinity is a property of the specific drug-receptor interaction.'}
],
memory:'Spare receptors = a high-efficacy drug does not need to occupy them all. EC₅₀ < Kd when spares exist.',
exam:'Kd ≠ EC₅₀ when spare receptors are present. Kd is a binding constant; EC₅₀ is a functional measure.'},

{id:4,mod:'m1',type:'MCQ',
q:'A Schild plot is constructed for an antagonist of an M₃ muscarinic receptor. The slope is 1.0 and the x-intercept is at log[B] = -8. Which ONE of the following BEST describes this antagonist?',
options:[
  {text:'An allosteric modulator with pA₂ = 8',correct:false,
   explain:'Slope of 1.0 indicates SIMPLE competitive reversible antagonism, not allosteric. Allosteric modulators typically give slopes ≠ 1 because they do not compete for the orthosteric site.'},
  {text:'A competitive reversible antagonist with Kb = 10⁻⁸ M',correct:true,
   explain:'Schild slope = 1.0 → competitive reversible at the orthosteric site. The x-intercept = pA₂ = -log Kb. If pA₂ = 8, then Kb = 10⁻⁸ M = 10 nM. Kb is independent of agonist affinity/efficacy.'},
  {text:'An inverse agonist with Kd = 10⁸ M',correct:false,
   explain:'Inverse agonists are not analysed by Schild plots (which measure antagonist potency by dose-ratio shifts). Also, Kd = 10⁸ M would be impossibly weak binding.'},
  {text:'A physiological antagonist with pA₂ = -8',correct:false,
   explain:'Physiological antagonists work via DIFFERENT receptors → do not produce simple Schild-analysable shifts. pA₂ = -8 would mean Kb = 10⁸ M (impossibly weak). pA₂ is always positive for real antagonists.'}
],
memory:'Schild slope of 1 = clean competitive reversible. x-intercept = pA₂ = -log Kb.',
exam:'Slope ≠ 1 suggests irreversible, allosteric, or more complex antagonism.'},

{id:5,mod:'m1',type:'MCQ',
q:'A patient on long-term salbutamol for asthma reports the drug is less effective despite increasing doses. Which ONE of the following BEST explains the mechanism of this tolerance?',
options:[
  {text:'Hepatic CYP3A4 induction increases salbutamol metabolism, reducing plasma levels',correct:false,
   explain:'Salbutamol is primarily metabolised by sulphation (Phase II), not CYP3A4. This pathway is not significantly induced by chronic salbutamol use. Metabolic tolerance is a less prominent mechanism here.'},
  {text:'β₂ adrenoceptor desensitisation via GRK phosphorylation followed by β-arrestin-mediated internalisation',correct:true,
   explain:'The two-step receptor desensitisation: (1) GRK/BARK phosphorylates the receptor C-terminus within MINUTES → loss of G-protein coupling → silent receptor. (2) β-arrestin recruits clathrin → endocytosis over HOURS → downregulation. Both reduce salbutamol effect.'},
  {text:'Increased intrinsic activity of M₃ muscarinic receptors causing physiological antagonism',correct:false,
   explain:'No evidence that M₃ activity increases with chronic β₂ agonist use. Physiological antagonism is acute, not progressive over weeks.'},
  {text:'Conversion of salbutamol to an inverse agonist via Phase I metabolism',correct:false,
   explain:'Salbutamol metabolism does not convert it to an inverse agonist. This option uses real terms (inverse agonism, Phase I) to sound plausible — a classic distractor pattern.'}
],
memory:'Desensitisation: minutes (uncoupling) → hours (endocytosis). Both are part of "tolerance".',
exam:'Corticosteroids upregulate β₂ receptors → restoring salbutamol responsiveness. This is why ICS are used WITH SABAs in asthma.'},

{id:6,mod:'m1',type:'MCQ',
q:'A patient presents with bradycardia, miosis, lacrimation, urinary incontinence, and bronchoconstriction after pesticide exposure. Atropine is administered. Which ONE of the following BEST explains atropine\'s mechanism in this scenario?',
options:[
  {text:'Atropine inhibits acetylcholinesterase, reducing acetylcholine levels at the synapse',correct:false,
   explain:'Atropine does NOT inhibit AChE — that is what the pesticide (organophosphate) did to cause the toxicity. Atropine works at a different site entirely.'},
  {text:'Atropine is a competitive reversible antagonist at muscarinic receptors, blocking excess ACh at end-organs',correct:true,
   explain:'Organophosphate → AChE inhibition → ACh accumulates at all cholinergic synapses → SLUDGE-BM symptoms (muscarinic) PLUS nicotinic effects. Atropine competitively blocks mAChR → reverses muscarinic symptoms only. PRALIDOXIME is added to regenerate AChE itself.'},
  {text:'Atropine reactivates phosphorylated acetylcholinesterase by removing the phosphate group',correct:false,
   explain:'That is PRALIDOXIME (2-PAM), not atropine. Pralidoxime is the second antidote given in OP poisoning to actually regenerate the enzyme — but only works before "aging".'},
  {text:'Atropine acts as an inverse agonist at nicotinic receptors, reducing constitutive activity',correct:false,
   explain:'Atropine has NO effect at nicotinic receptors. Atropine is a SELECTIVE muscarinic antagonist. This is why OP poisoning still has nicotinic symptoms (muscle fasciculations) after atropine.'}
],
memory:'OP poisoning antidote = Atropine (blocks mAChR) + Pralidoxime (reactivates AChE). Atropine does not touch nicotinic.',
exam:'After atropine, nicotinic symptoms (muscle weakness, fasciculations) persist — patient may still need ventilation.'},

{id:7,mod:'m1',type:'MCQ',
q:'Which ONE of the following statements regarding the autonomic nervous system is CORRECT?',
options:[
  {text:'All sympathetic postganglionic fibres release noradrenaline onto adrenergic receptors',correct:false,
   explain:'EXCEPTION: sympathetic postganglionic fibres innervating sweat glands release ACh (not NA) onto muscarinic receptors. This is the classic ANS exception.'},
  {text:'The vagus nerve (CN X) is part of the sympathetic outflow innervating thoracic organs',correct:false,
   explain:'Vagus is the major PARASYMPATHETIC nerve (cranial outflow), not sympathetic. It innervates the heart (slowing it), lungs, and upper GI tract via the PNS branch.'},
  {text:'Preganglionic fibres in both sympathetic and parasympathetic systems release acetylcholine onto nicotinic receptors',correct:true,
   explain:'GOLDEN RULE: ALL preganglionic autonomic fibres (PNS and SNS) release ACh onto nAChR at the ganglion. The difference is the postganglionic neurotransmitter: ACh in PNS, NA in most SNS (with sweat gland exception).'},
  {text:'The adrenal medulla is innervated by parasympathetic postganglionic fibres releasing acetylcholine',correct:false,
   explain:'Adrenal medulla is innervated by SYMPATHETIC PREganglionic fibres (acts like a modified ganglion). The fibres release ACh onto chromaffin cells, which then release adrenaline + NA into blood.'}
],
memory:'Pre = ACh always (both branches). Post = ACh (PNS) or NA (most SNS). Sweat gland & adrenal medulla = ACh exceptions.',
exam:'Adrenal medulla = "modified ganglion" — directly innervated by sympathetic preganglionic ACh fibres.'},

{id:8,mod:'m1',type:'MCQ',
q:'Which ONE of the following correctly pairs a drug class with its therapeutic use?',
options:[
  {text:'α₂ adrenoceptor agonist — used for benign prostatic hyperplasia (BPH)',correct:false,
   explain:'BPH is treated with α₁ ANTAGONISTS (tamsulosin, prazosin) — they relax prostate smooth muscle. α₂ agonists (clonidine) are used for HYPERTENSION, not BPH.'},
  {text:'β₂ adrenoceptor agonist — used for acute asthma exacerbation',correct:true,
   explain:'Salbutamol/albuterol = SABA = β₂ agonist → Gαs → ↑cAMP → bronchial smooth muscle relaxation → bronchodilation. First-line for acute asthma. Salmeterol/formoterol = LABAs for chronic.'},
  {text:'Non-selective β-blocker — first-line treatment for asthma',correct:false,
   explain:'OPPOSITE — non-selective β-blockers (propranolol) are CONTRAINDICATED in asthma because they block β₂ → bronchoconstriction. This is a guaranteed exam trap.'},
  {text:'Muscarinic agonist — used for benign prostatic hyperplasia',correct:false,
   explain:'BPH = α₁ blockers OR 5α-reductase inhibitors (finasteride). Muscarinic agonists (bethanechol) are for URINARY RETENTION (different problem) — they CONTRACT the detrusor.'}
],
memory:'BPH = α₁ blocker (relax prostate). Asthma = β₂ agonist. NEVER non-selective β-blocker in asthma.',
exam:'Tamsulosin is α₁A selective — fewer cardiovascular side effects than non-selective α blockers.'},

{id:9,mod:'m1',type:'MCQ',
q:'A novel drug binds the M₃ muscarinic receptor at a site distinct from acetylcholine and increases ACh\'s ability to activate the receptor. The drug alone has no effect on receptor activity. Which ONE of the following BEST describes the drug?',
options:[
  {text:'A positive allosteric modulator (PAM) at the M₃ receptor',correct:true,
   explain:'PAM characteristics: (1) Binds an ALLOSTERIC site (distinct from orthosteric ACh site) ✓, (2) Has NO effect alone ✓, (3) Increases agonist (ACh) effect ✓. All three criteria match. PAMs offer subtype selectivity advantages because allosteric sites differ more between M₁–M₅ than orthosteric sites do.'},
  {text:'A competitive full agonist at the M₃ receptor',correct:false,
   explain:'A competitive agonist would bind the ORTHOSTERIC site (where ACh binds) and produce an effect ALONE. This drug does not do either.'},
  {text:'A neutral antagonist that potentiates ACh through unknown mechanisms',correct:false,
   explain:'Neutral antagonists BLOCK agonist binding — they do not potentiate it. The mechanism described (binding a different site, potentiating ACh) is the textbook definition of a PAM, not an antagonist.'},
  {text:'A biased agonist favouring the β-arrestin pathway',correct:false,
   explain:'Biased agonists DO produce an effect on their own (they activate one pathway over another). This drug has no effect alone — that is a hallmark of a silent allosteric modulator or PAM, not biased agonism.'}
],
memory:'PAM = no effect alone, boosts agonist when present. Benzos at GABA-A are the classic example.',
exam:'Allosteric sites differ between receptor subtypes more than orthosteric sites → allosteric drugs can be more selective.'},

{id:10,mod:'m1',type:'MCQ',
q:'Stimulation of which ONE of the following receptor subtypes would produce both INCREASED heart rate AND bronchodilation?',
options:[
  {text:'M₂ muscarinic and β₂ adrenoceptors simultaneously',correct:false,
   explain:'M₂ activation DECREASES heart rate (bradycardia via Gαi → ↓cAMP at SA node). The question asks for both effects from ONE receptor stimulation, not two opposing ones.'},
  {text:'α₁ adrenoceptors via Gαq coupling',correct:false,
   explain:'α₁ causes VASOCONSTRICTION (Gαq → ↑Ca²⁺ in vascular smooth muscle). It does not significantly affect heart rate or bronchi.'},
  {text:'Non-selective β agonist activating both β₁ and β₂ receptors',correct:true,
   explain:'Adrenaline (epinephrine) is a non-selective β agonist: β₁ → Gαs → ↑cAMP at SA node → ↑HR; β₂ → Gαs → ↑cAMP in bronchial smooth muscle → bronchodilation. Both via Gαs but at different tissues. This is why adrenaline is used in anaphylaxis.'},
  {text:'M₃ muscarinic receptor via Gαq coupling',correct:false,
   explain:'M₃ does the OPPOSITE — Gαq → ↑Ca²⁺ in bronchial smooth muscle → BRONCHOCONSTRICTION. M₃ has no direct effect on SA node heart rate.'}
],
memory:'Adrenaline = β₁ (↑HR) + β₂ (bronchodilation) + α₁ (vasoconstrict). All three needed for anaphylaxis.',
exam:'Selective β₁ blockers (atenolol) preserve β₂ bronchodilation in asthmatics — safer than non-selective.'},

{id:11,mod:'m2',type:'MCQ',
q:'Aspirin (pKa 3.5) is administered orally. In which of the following compartments will aspirin be MOST extensively absorbed by passive diffusion per unit area of membrane?',
options:[
  {text:'Small intestine (pH 6.5) because the larger surface area overrides ionisation effects',correct:false,
   explain:'Surface area helps total absorption in vivo, but the question asks about passive diffusion EFFICIENCY per unit area. At pH 6.5, aspirin is ~99.9% IONISED (pH - pKa = +3) → very little un-ionised drug available for diffusion. Per unit area, intestinal diffusion is much less efficient than gastric.'},
  {text:'Stomach (pH 2.0) because aspirin is predominantly un-ionised',correct:true,
   explain:'Henderson-Hasselbalch for a weak acid at pH 2.0: pH - pKa = -1.5 → log([A⁻]/[HA]) = -1.5 → [HA]/[A⁻] = 31.6 → ~97% UN-IONISED. Un-ionised lipophilic form crosses membranes by passive diffusion. Per unit area, gastric absorption is most efficient for weak acids.'},
  {text:'Colon (pH 7.5) due to long transit time allowing absorption',correct:false,
   explain:'Colon has high pH → weak acids fully ionised → very poor passive absorption. Transit time helps sustained-release formulations but does not help an acid drug diffuse passively.'},
  {text:'Mouth (pH 6.8) — sublingual absorption avoids first-pass',correct:false,
   explain:'Aspirin is not given sublingually, and at pH 6.8 it is significantly ionised. Sublingual route is used for drugs needing rapid systemic delivery (GTN), not aspirin.'}
],
memory:'Acids absorbed in acid (un-ionised). Bases absorbed in base. Direction flips between the two.',
exam:'Identify acid vs base FIRST. The ionisation direction is opposite for each. Henderson-Hasselbalch: weak acid uses [A⁻]/[HA].'},

{id:12,mod:'m2',type:'MCQ',
q:'Three drugs have the following logP values: drug A = -1.5, drug B = 2.5, drug C = 6.0. Which ONE of the following statements is CORRECT regarding their predicted behaviour?',
options:[
  {text:'Drug A will have the highest oral bioavailability because it dissolves easily in gut fluid',correct:false,
   explain:'Solubility is necessary but not sufficient. Drug A (logP -1.5) is too hydrophilic to CROSS lipid cell membranes → poor passive absorption despite good aqueous solubility. Lipinski Ro5 implies logP between 0–5; drug A is too low.'},
  {text:'Drug C will accumulate in adipose tissue and have a large volume of distribution',correct:true,
   explain:'logP = 6.0 → extremely lipophilic → partitions strongly into lipid-rich tissues including adipose, brain, and lipid bilayers. Very large Vd (drug "hides" in tissues, low plasma concentration). However, logP > 5 violates Lipinski Ro5 → expected poor oral absorption + non-specific tissue binding + likely CYP3A4 substrate.'},
  {text:'Drug B is too lipophilic to cross the blood-brain barrier',correct:false,
   explain:'BACKWARDS — logP 2.5 is in the IDEAL range (1–3) and crosses BBB well. High lipophilicity (logP > 3) generally PROMOTES BBB penetration (along with low MW, low H-bond donor count).'},
  {text:'Drug A has the highest probability of being a CYP3A4 substrate',correct:false,
   explain:'OPPOSITE — CYP3A4 substrates tend to be LIPOPHILIC (high logP). Drug C (logP 6) is far more likely to be a CYP3A4 substrate than drug A (logP -1.5).'}
],
memory:'Goldilocks logP = 1–3. Too low (< 0) → cannot cross membranes. Too high (> 5) → adipose accumulation, CYP3A4 metabolism, Ro5 violation.',
exam:'High logP = adipose accumulation + high Vd + likely CYP3A4 substrate + non-specific binding. All four travel together.'},

{id:13,mod:'m2',type:'MCQ',
q:'A medicinal chemist replaces the ester group in acetylcholine (-OCOCH₃) with a carbamate group (-OCONH₂) to create carbachol. Which ONE of the following BEST describes the pharmacological consequence?',
options:[
  {text:'Carbachol has lower affinity for mAChR because the carbamate is less polar',correct:false,
   explain:'Carbamate and ester have similar shape, size, and electronic properties — carbachol retains good mAChR binding. The bioisostere preserves binding while changing metabolic fate.'},
  {text:'Carbachol resists acetylcholinesterase hydrolysis, providing longer duration of action',correct:true,
   explain:'The NH₂ group on carbamate is electron-donating → makes the carbonyl carbon less electrophilic → AChE serine nucleophile attacks it much more slowly. Same shape at receptor (preserved binding), different fate at enzyme (resistant to hydrolysis). Classic BIOISOSTERE replacement.'},
  {text:'Carbachol becomes selective for nicotinic over muscarinic receptors',correct:false,
   explain:'Carbachol is NON-selective — it acts at both mAChR and nAChR. The ester→carbamate change affects metabolism, not receptor selectivity. β-methyl substitution (methacholine, bethanechol) creates mAChR selectivity by introducing steric clash at nAChR.'},
  {text:'Carbachol gains the ability to cross the blood-brain barrier',correct:false,
   explain:'Both ACh and carbachol carry a permanent positive charge (quaternary nitrogen) → neither crosses BBB efficiently. Carbamate change does not affect ionisation or lipophilicity significantly.'}
],
memory:'Bioisostere = same shape (preserved binding) + different metabolism (changed fate). Carbamate resists AChE.',
exam:'β-methyl on choline = mAChR selectivity. Carbamate = AChE resistance. Bethanechol = both = mAChR-selective AND long-acting.'},

{id:14,mod:'m2',type:'MCQ',
q:'During AChE-mediated hydrolysis of acetylcholine, which ONE of the following correctly describes a step in the mechanism?',
options:[
  {text:'Histidine in the catalytic triad acts as a direct nucleophile attacking the ester carbonyl',correct:false,
   explain:'Histidine is part of the catalytic triad (Ser-His-Glu) but functions as a GENERAL BASE, not a nucleophile. It deprotonates serine to make serine a stronger nucleophile. SERINE is the actual nucleophile attacking ACh.'},
  {text:'Serine 200 acts as a nucleophile, forming a covalent acetyl-enzyme intermediate, releasing choline',correct:true,
   explain:'Two-step mechanism. Step 1 (ACETYLATION): Ser200 (activated by His440) attacks the carbonyl carbon of ACh → tetrahedral transition state → ester C-O bond breaks → choline leaves → acetyl group remains COVALENTLY bonded to serine. Step 2 (DEACETYLATION): water attacks the acetyl-serine → acetic acid leaves → free enzyme restored.'},
  {text:'Glutamate ionic bonds with choline\'s quaternary nitrogen, hydrolysing the ester directly',correct:false,
   explain:'Glutamate is part of the catalytic triad but it STABILISES the histidine charge — it does not directly contact choline or hydrolyse anything. Choline is positioned in the active site by aromatic residues (cation-π interactions), not glutamate.'},
  {text:'Two water molecules attack the ester carbonyl simultaneously',correct:false,
   explain:'AChE catalysis does not use a "two-water" mechanism. Water is only involved in Step 2 (deacetylation), and only one water attacks the acetyl-enzyme intermediate.'}
],
memory:'SHE = Serine-Histidine-Glutamate. Step 1 = serine grabs acetyl (covalent). Step 2 = water rescues serine.',
exam:'Organophosphates phosphorylate this same Ser200 — but the phospho-enzyme cannot be hydrolysed by water → permanent inhibition until "aging" makes it impossible to reverse.'},

{id:15,mod:'m2',type:'MCQ',
q:'Donepezil treats Alzheimer\'s disease by reversibly inhibiting AChE. Which ONE of the following BEST describes its mechanism compared to physostigmine?',
options:[
  {text:'Donepezil carbamylates the active-site serine, identical to physostigmine\'s mechanism',correct:false,
   explain:'Physostigmine is a CARBAMATE that carbamylates serine. Donepezil does NOT covalently modify the enzyme — it is a non-covalent reversible inhibitor working through different chemistry.'},
  {text:'Donepezil binds the gorge via π-π stacking interactions, blocking ACh entry without contacting the catalytic triad',correct:true,
   explain:'Donepezil has two aromatic ring systems (indanone and benzylpiperidine) that stack with the aromatic gorge residues (Trp, Tyr, Phe) via π-π and cation-π interactions. It physically blocks the gorge entrance without ever reaching the catalytic Ser-His-Glu. Fully reversible non-competitive inhibitor.'},
  {text:'Donepezil phosphorylates serine but with rapid spontaneous dephosphorylation',correct:false,
   explain:'Phosphorylation = ORGANOPHOSPHATES (irreversible). Donepezil does not covalently modify anything. The chemistry described is for nerve agents, not Alzheimer drugs.'},
  {text:'Donepezil acts as a positive allosteric modulator at AChE, increasing ACh affinity',correct:false,
   explain:'Donepezil is an AChE INHIBITOR (reduces enzyme activity), not a PAM. PAMs of AChE would increase ACh degradation → worsen Alzheimer symptoms.'}
],
memory:'Donepezil = gorge blocker. Physostigmine = carbamylating drug. OPs = phosphorylating nerve agents.',
exam:'Donepezil crosses BBB (designed neutral). Physostigmine also crosses BBB. Neostigmine is QUATERNARY → does not cross BBB (used peripherally for myasthenia gravis).'},

{id:16,mod:'m3',type:'MCQ',
q:'Which ONE of the following statements is CORRECT? SLC and ABC transporters differ in that:',
options:[
  {text:'SLC transporters facilitate drug efflux from cells while ABC transporters facilitate drug influx',correct:false,
   explain:'BACKWARDS — SLCs (Solute Carriers) generally facilitate INFLUX (drug entry into cells). ABCs (ATP-Binding Cassette) facilitate EFFLUX (pumping drug out). P-gp is the most famous ABC efflux transporter.'},
  {text:'Overexpression of SLC transporters in cancer cells is responsible for anticancer drug resistance',correct:false,
   explain:'OPPOSITE — Multi-drug resistance in cancer is due to overexpression of ABC EFFLUX transporters (P-gp, MRPs), which pump chemotherapy drugs out of tumour cells. Overexpression of SLC INFLUX transporters would help drugs ENTER tumour cells.'},
  {text:'ABC transporters, but not SLC transporters, are subject to genetic polymorphisms',correct:false,
   explain:'BOTH are polymorphic. P-gp (ABCB1) has well-known polymorphisms; SLCO1B1 (an SLC) polymorphism causes simvastatin myopathy. Genetic variation affects both classes.'},
  {text:'ABC transporters, but not SLC transporters, hydrolyse ATP',correct:true,
   explain:'ABC = ATP-Binding Cassette → they USE ATP hydrolysis for active transport against gradients (primary active transport). SLCs are mostly facilitative (down gradient) or use ION gradients (secondary active transport, e.g. Na⁺-coupled), but they do NOT hydrolyse ATP directly. This is the defining biochemical difference.'}
],
memory:'ABC = ATP + efflux + cancer resistance. SLC = no ATP + influx + gradient-driven.',
exam:'P-gp knockout mice absorb ~10× more oral paclitaxel — proves P-gp role in limiting absorption.'},

{id:17,mod:'m3',type:'MCQ',
q:'A 28-year-old woman taking the combined oral contraceptive pill (COCP) starts rifampicin for tuberculosis. Three weeks later she presents pregnant. Which ONE of the following BEST explains this contraceptive failure?',
options:[
  {text:'Rifampicin competitively inhibits intestinal CYP3A4, decreasing oestrogen absorption',correct:false,
   explain:'OPPOSITE — Inhibition of CYP3A4 would INCREASE oestrogen levels (less metabolism). Also, rifampicin is an INDUCER not an inhibitor. The directions and types of effect are both wrong.'},
  {text:'Rifampicin induces CYP3A4 via PXR activation, accelerating oestrogen metabolism',correct:true,
   explain:'Rifampicin is a potent PXR (pregnane X receptor) ligand → ↑transcription of CYP3A4 over days-weeks → faster metabolism of oestrogen and progesterone components of COCP → subtherapeutic hormone levels → ovulation breakthrough → pregnancy. Same mechanism affects warfarin, immunosuppressants, antiretrovirals.'},
  {text:'Rifampicin blocks oestrogen receptors directly, mimicking menopause',correct:false,
   explain:'Rifampicin has no direct effect on oestrogen receptors. It works entirely through hepatic enzyme induction (pharmacokinetic), not pharmacodynamic interference with hormone signalling.'},
  {text:'Rifampicin reduces P-gp expression, decreasing oestrogen elimination',correct:false,
   explain:'Rifampicin actually INDUCES P-gp (along with CYP3A4 — both regulated by PXR). And induction of P-gp would INCREASE elimination, not decrease it.'}
],
memory:'Rifampicin = the great inducer. CYP3A4 + P-gp both upregulated via PXR.',
exam:'Other CYP3A4 inducers: carbamazepine, phenytoin, St John\'s Wort, chronic alcohol. CYP1A2 inducer: smoking.'},

{id:18,mod:'m3',type:'MCQ',
q:'A patient with poor metaboliser CYP2D6 genotype is given codeine 30 mg orally for postoperative pain. They report no analgesia after the first dose. Which ONE of the following BEST explains this?',
options:[
  {text:'CYP2D6 PMs cannot convert codeine to morphine — the active analgesic',correct:true,
   explain:'Codeine is a PRODRUG. ~10% is converted to morphine by CYP2D6. Morphine is the actual analgesic at μ-opioid receptors. PMs (2 non-functional alleles, ~7% Caucasians) cannot perform this O-demethylation → no morphine produced → no analgesia. Use a non-CYP2D6-dependent analgesic instead (paracetamol, NSAID, IV morphine).'},
  {text:'CYP2D6 PMs metabolise codeine too rapidly via Phase II glucuronidation',correct:false,
   explain:'PMs have IMPAIRED metabolism (slow), not rapid. Also, codeine activation is Phase I (CYP2D6 O-demethylation), not Phase II glucuronidation.'},
  {text:'CYP3A4 polymorphism in PMs leads to inactive codeine-3-glucuronide accumulation',correct:false,
   explain:'CYP2D6 (not 3A4) is the relevant enzyme. CYP3A4 produces norcodeine (inactive), not the active morphine metabolite.'},
  {text:'PMs have constitutively low μ-opioid receptor expression',correct:false,
   explain:'CYP2D6 polymorphism affects DRUG METABOLISM (PK), not opioid receptor expression (PD). The receptors are normal — the patient just cannot make morphine from codeine. Give morphine directly and they will respond normally.'}
],
memory:'CYP2D6 PM + codeine = NO analgesia. UM + codeine = TOO MUCH morphine (overdose risk).',
exam:'Ultra-rapid metaboliser breastfeeding mothers given codeine have caused infant deaths from morphine in breast milk.'},

{id:19,mod:'m3',type:'MCQ',
q:'The clearance value for theophylline is 3.6 L/h. A patient has a plasma concentration of 15 mg/L. What is the elimination rate?',
options:[
  {text:'4.2 mg/h',correct:false,
   explain:'This is 15 ÷ 3.6 — but you have done the calculation backwards. Rate is CL × Cp, not Cp ÷ CL. Dividing gives an answer with wrong units (mg per unit time²).'},
  {text:'54 mg/h',correct:true,
   explain:'Rate of elimination = Clearance × Plasma concentration. Rate = 3.6 L/h × 15 mg/L = 54 mg/h. The L units cancel, leaving mg/h. This is first-order linear elimination (most drugs at therapeutic doses).'},
  {text:'18.6 mg/h',correct:false,
   explain:'This is 3.6 + 15 — ADDING instead of multiplying. Always work the equation: Rate = CL × Cp. Units must cancel correctly (L/h × mg/L = mg/h).'},
  {text:'5.4 mg/h',correct:false,
   explain:'This looks like a decimal error. The correct calculation: 3.6 × 15 = 54.0 mg/h. Watch decimal placement and recheck units.'}
],
memory:'Rate = CL × Cp. Units: L/h × mg/L = mg/h. Always check unit cancellation.',
exam:'At steady state (chronic dosing), rate of administration = rate of elimination. So dose rate = CL × Css.'},

{id:20,mod:'m3',type:'MCQ',
q:'Which ONE of the following statements regarding debrisoquine toxicity is CORRECT?',
options:[
  {text:'Non-functional CYP3A4 genes impair the phase II acetylation of the drug, so that the toxic metabolite isonicotinic acid accumulates',correct:false,
   explain:'Multiple errors: (1) Debrisoquine is metabolised by CYP2D6, not CYP3A4. (2) Hydroxylation is Phase I, not Phase II. Acetylation IS Phase II but is the wrong reaction here. (3) Isonicotinic acid is the metabolite of isoniazid (a different drug), not debrisoquine.'},
  {text:'High-functioning 2D6 genes increase the phase II hydroxylation of the drug, so that the toxic metabolite debrisoquine hydroxide accumulates',correct:false,
   explain:'Hydroxylation is Phase I, not Phase II. Also, "high-functioning" CYP2D6 (UMs) would clear debrisoquine FASTER → less drug, not more toxic metabolite. The 4-hydroxydebrisoquine product is the inactive form.'},
  {text:'Non-functional CYP2D6 genes impair the phase I hydroxylation of the drug leading to a requirement for a lower dose',correct:true,
   explain:'Debrisoquine is the classic CYP2D6 substrate (its metabolism is the original CYP2D6 phenotyping test). PMs (non-functional CYP2D6) cannot perform 4-hydroxylation (PHASE I) → parent drug accumulates → enhanced antihypertensive effect → severe hypotension at standard doses → REQUIRES DOSE REDUCTION.'},
  {text:'Non-functional CYP2D6 genes impair the phase I acetylation of the drug, so that the toxic metabolite isonicotinic acid accumulates',correct:false,
   explain:'Acetylation is Phase II, not Phase I. CYP2D6 does not perform acetylation (NAT enzymes do). Isonicotinic acid is from isoniazid metabolism, not debrisoquine.'}
],
memory:'Debrisoquine = CYP2D6 + Phase I hydroxylation. PM → drug accumulates → reduce dose.',
exam:'Distinguish CYP2D6 (debrisoquine, codeine, antidepressants) from CYP3A4 (statins, BZDs). Distinguish hydroxylation (Phase I, by CYPs) from acetylation (Phase II, by NATs).'},

{id:21,mod:'m3',type:'MCQ',
q:'Three new drugs (loptimin, vasimin and catamin) have been developed by your pharmaceutical company. Their log P values are: loptimin = -2.0, vasimin = 4.0, and catamin = 1.5. Which ONE of the following options is CORRECT?',
options:[
  {text:'Loptimin is more likely than vasimin to accumulate in adipose tissue',correct:false,
   explain:'BACKWARDS — adipose tissue is LIPID-RICH, so lipophilic (high logP) drugs accumulate there. Loptimin (logP -2.0) is highly hydrophilic → very poor adipose partition. Vasimin (logP 4.0) is much more lipophilic → much higher adipose accumulation.'},
  {text:'Catamin is more likely than vasimin to accumulate in adipose tissue',correct:false,
   explain:'Catamin (logP 1.5) is less lipophilic than vasimin (logP 4.0). Higher logP = more partitioning into lipid compartments (including adipose tissue). Vasimin accumulates MORE in adipose, not less.'},
  {text:'Loptimin is more likely than catamin to accumulate in adipose tissue',correct:false,
   explain:'Loptimin (logP -2.0) is hydrophilic — barely crosses lipid membranes, definitely does not partition into adipose. Catamin (logP 1.5) is moderately lipophilic — much more adipose partitioning than loptimin.'},
  {text:'Vasimin is more likely than loptimin to accumulate in adipose tissue',correct:true,
   explain:'Vasimin has the highest logP (4.0) of the three — most lipophilic → strongly partitions into lipid-rich tissues including adipose. Loptimin (logP -2.0) is hydrophilic and stays in aqueous compartments. General principle: high logP → high Vd → tissue accumulation, especially lipid-rich tissues (adipose, brain, liver). LogP 4 is near the Lipinski threshold (5) — drug-like but flirting with problems.'}
],
memory:'High logP = lipophilic = adipose accumulation + high Vd + can cross BBB. Low logP = hydrophilic = stays in plasma/ECF.',
exam:'Adipose accumulation = high Vd = slow elimination after stopping = prolonged effect (e.g. amiodarone, t½ ~50 days).'},

{id:22,mod:'m3',type:'MCQ',
q:'Analysis of which ONE of the following biological samples would provide CONVENIENT and RAPID information on recent exposure to illicit drugs?',
options:[
  {text:'Adipose tissue biopsies',correct:false,
   explain:'Adipose biopsies require an INVASIVE procedure (needle or surgical biopsy) — not convenient or rapid. Adipose stores lipophilic drugs long-term (months) — useful for historical exposure but not recent. Lab analysis is also complex.'},
  {text:'Faeces',correct:false,
   explain:'Faecal analysis is possible but is NOT convenient (sample collection, processing) or rapid (results take days). Used in research and post-mortem cases, not routine drug screening.'},
  {text:'Saliva or urine samples',correct:true,
   explain:'BOTH are: (1) NON-INVASIVE — patient provides sample easily. (2) RAPID — immunoassay point-of-care tests give results in minutes (urine drug screens, saliva tests). (3) Reflect RECENT use (hours to days). (4) Widely used in clinical, workplace, roadside, and forensic settings. Urine = gold standard for drug screening; saliva is increasingly used for roadside testing.'},
  {text:'Hair samples',correct:false,
   explain:'Hair analysis is non-invasive but NOT rapid — analysis takes weeks (sample preparation, GC-MS). Hair detects HISTORICAL exposure (months) — drugs incorporated as hair grows. Not "rapid".'}
],
memory:'Saliva/urine = recent exposure, rapid, non-invasive. Hair = historical (months), slow analysis. Adipose = lipophilic drugs, invasive.',
exam:'Detection windows: urine ~3 days; saliva ~24h; hair ~3 months; blood ~12h. Match the sample to the time-frame of interest.'},

{id:23,mod:'m3',type:'MCQ',
q:'A patient develops severe muscle pain after starting simvastatin. Genetic testing shows they carry a SLCO1B1 polymorphism. Which ONE of the following BEST explains the mechanism of this toxicity?',
options:[
  {text:'Reduced hepatic uptake of simvastatin via SLCO1B1, increasing plasma exposure and muscle toxicity',correct:true,
   explain:'SLCO1B1 encodes OATP1B1, an SLC transporter on hepatocytes that takes up statins from blood for first-pass metabolism. Reduced function → ↓hepatic uptake → ↑plasma simvastatin → ↑muscle exposure → MYOPATHY/rhabdomyolysis. One of the best-characterised pharmacogenetic associations (FDA labelling for simvastatin includes SLCO1B1 testing recommendations).'},
  {text:'Increased CYP3A4 activity rapidly converting simvastatin to a toxic active metabolite',correct:false,
   explain:'CYP3A4 metabolises simvastatin to ACTIVE acid form — this is the intended activation. CYP3A4 induction would DECREASE statin levels.'},
  {text:'Polymorphisms in MDR1/P-gp increase brain penetration of simvastatin, causing central neurotoxicity',correct:false,
   explain:'Statin myopathy is a PERIPHERAL effect (skeletal muscle), not central. P-gp polymorphisms can affect distribution but are not the main cause of statin myopathy.'},
  {text:'SLCO1B1 polymorphism reduces glucuronidation by UGT1A1, leading to bilirubin-induced muscle damage',correct:false,
   explain:'SLCO1B1 is a TRANSPORTER, not a metabolising enzyme. UGT1A1 is unrelated. Bilirubin does not cause muscle damage. Multiple errors.'}
],
memory:'SLCO1B1 = hepatic uptake transporter for statins. Loss-of-function → ↑plasma statin → myopathy. FDA-labelled pharmacogenetic risk.',
exam:'SLC transporters ARE subject to clinically important polymorphisms — disproving the misconception that only CYPs matter pharmacogenetically.'},

{id:24,mod:'m4',type:'MCQ',
q:'A new drug enters Phase 1 clinical trials. Which ONE of the following statements about Phase 1 trials is MOST accurate?',
options:[
  {text:'Phase 1 trials test efficacy in 1,000–3,000 patients with the target disease',correct:false,
   explain:'That describes PHASE 3. Phase 1 is much smaller (20–80) and uses HEALTHY VOLUNTEERS (not patients) for most drug classes. Exception: oncology Phase 1 uses cancer patients due to ethical reasons.'},
  {text:'Phase 1 trials primarily assess safety, tolerability, PK, and dose-limiting toxicities in healthy volunteers',correct:true,
   explain:'Phase 1 = first-in-human. 20–80 healthy volunteers (oncology = patients). Primary goals: SAFETY (dose-limiting toxicities), TOLERABILITY, PHARMACOKINETICS (Cmax, t½, AUC, F), establishing maximum tolerated dose (MTD). Efficacy is NOT the primary endpoint (that is Phase 2). SAD → MAD → food effect studies.'},
  {text:'Phase 1 trials are randomised, double-blind, placebo-controlled to detect efficacy signals',correct:false,
   explain:'Phase 1 is typically OPEN-LABEL, dose-escalation. Randomisation/blinding becomes important in Phase 2 and crucial in Phase 3. Efficacy detection is a Phase 2/3 goal, not Phase 1.'},
  {text:'Phase 1 establishes the regulatory dossier required for approval',correct:false,
   explain:'The regulatory dossier (CTD) is compiled from ALL phases. Approval requires Phase 3 data primarily. Phase 1 contributes safety/PK data but is far from sufficient alone.'}
],
memory:'Phase 1 = First in humans, small, healthy volunteers, safety + PK. Phase 2 = patients (efficacy). Phase 3 = RCT (registration).',
exam:'Approximately 1 in 10 drugs entering Phase 1 reaches market. Most failures occur in Phase 2/3.'},

{id:25,mod:'m4',type:'MCQ',
q:'Which ONE of the following correctly describes a feature of the Common Technical Document (CTD)?',
options:[
  {text:'The CTD is a single-page summary of the drug\'s efficacy data submitted to the TGA',correct:false,
   explain:'The CTD is a MASSIVE multi-volume document (often 100,000+ pages) covering quality, non-clinical, clinical, and administrative data. Far from a "single-page summary".'},
  {text:'The CTD is internationally harmonised (ICH) into 5 modules: Administrative, Summary, Quality, Non-clinical, Clinical',correct:true,
   explain:'CTD has 5 modules: Module 1 (Administrative — region-specific), Module 2 (CTD Summaries — overview), Module 3 (Quality — chemistry, manufacturing, controls), Module 4 (Non-clinical study reports — pharmacology, PK, toxicology), Module 5 (Clinical study reports — Phase 1, 2, 3). ICH (International Council for Harmonisation) developed this so sponsors can submit similar dossiers to FDA, EMA, TGA, PMDA.'},
  {text:'The CTD only contains clinical trial data — preclinical data goes in a separate submission',correct:false,
   explain:'BOTH clinical AND non-clinical (preclinical) data are in the CTD (Module 4 = non-clinical, Module 5 = clinical). Quality/manufacturing data is also included (Module 3).'},
  {text:'Each regulatory agency (FDA, EMA, TGA) requires a completely different CTD format',correct:false,
   explain:'OPPOSITE — the entire POINT of the CTD is international HARMONISATION. Modules 2–5 are essentially identical across regions. Only Module 1 (administrative) differs by region.'}
],
memory:'CTD = 5 modules, ICH harmonised. Modules 2-5 are global; Module 1 is regional.',
exam:'eCTD (electronic CTD) is now standard — submitted as structured XML for searchable review.'},

{id:26,mod:'m4',type:'MCQ',
q:'During preclinical testing, a candidate drug shows a positive Ames test. Which ONE of the following is the MOST appropriate next step?',
options:[
  {text:'Proceed directly to Phase 1 trials in healthy volunteers, monitoring for cancer',correct:false,
   explain:'A positive Ames test (bacterial mutagenicity) is a SERIOUS safety signal. You cannot proceed to humans without further investigation. Monitoring volunteers for cancer would require decades and is unethical.'},
  {text:'Perform follow-up in vitro chromosomal aberration tests and in vivo micronucleus assays to confirm genotoxicity',correct:true,
   explain:'Positive Ames is a red flag but not definitive — bacteria differ from mammals. Confirmation requires the full genotoxicity battery: (1) Ames test (bacterial), (2) in vitro mammalian assays (chromosomal aberration, micronucleus, or mouse lymphoma TK), (3) in vivo mammalian assays (rodent bone marrow micronucleus). If multiple positive → genotoxic → development typically halted (unless life-threatening disease with no alternative).'},
  {text:'Increase the dose in animal toxicity studies to overwhelm the mutagenic effect',correct:false,
   explain:'Mutagenicity is dose-related but you CANNOT "overcome" it by higher doses — higher doses cause MORE damage. This option is dangerous nonsense.'},
  {text:'Conduct only reproductive toxicology to assess teratogenic potential',correct:false,
   explain:'Reproductive toxicology covers teratogenicity but not somatic mutagenicity/carcinogenicity. After positive Ames, you need the full genotoxicity battery, not just one downstream test.'}
],
memory:'Ames positive → in vitro mammalian → in vivo mammalian. 3-tier genotoxicity testing.',
exam:'Long-term carcinogenicity studies (2-year rodent) are required for chronic-use drugs but only after the genotoxicity package is acceptable.'},

{id:27,mod:'m4',type:'MCQ',
q:'Which ONE of the following BEST describes oligonucleotide therapeutics?',
options:[
  {text:'They are small molecules that cross cell membranes easily and have predictable PK',correct:false,
   explain:'OPPOSITE — oligonucleotides are LARGE charged molecules that cannot cross cell membranes by passive diffusion. They require delivery systems (lipid nanoparticles, GalNAc conjugates, viral vectors). Their PK is also complex.'},
  {text:'They face challenges including poor cellular delivery, nuclease degradation, and innate immune activation',correct:true,
   explain:'Oligonucleotides (antisense, siRNA, mRNA, aptamers) face: (1) Delivery — large, charged, hydrophilic → cannot cross membranes alone. (2) Stability — degraded by serum nucleases → need backbone modifications (phosphorothioate, LNA). (3) Immunogenicity — TLR activation, complement, anti-drug antibodies. (4) Off-target effects from partial complementarity. (5) Distribution — predominantly liver/kidney. Regulatory paradigm differs from small molecules.'},
  {text:'They are metabolised primarily by CYP3A4 in the liver',correct:false,
   explain:'Oligonucleotides are NOT CYP3A4 substrates — they are degraded by NUCLEASES (exonucleases, endonucleases), not by oxidative metabolism. They do not typically participate in CYP-mediated drug interactions.'},
  {text:'Genotoxicity testing for oligonucleotides follows the standard small-molecule paradigm',correct:false,
   explain:'Standard genotoxicity tests (Ames, etc.) are LESS RELEVANT for oligonucleotides — they ARE genetic material by design, not chemicals that interact with DNA non-specifically. Different regulatory considerations apply.'}
],
memory:'Oligonucleotides = large + charged + nuclease-sensitive + immunogenic. Delivery is the central challenge.',
exam:'Examples on market: nusinersen (SMA antisense), patisiran (siRNA), mRNA COVID vaccines.'},

{id:28,mod:'m4',type:'MCQ',
q:'A drug candidate causes QT interval prolongation in dogs during safety pharmacology testing. Which ONE of the following is the MOST appropriate concern?',
options:[
  {text:'QT prolongation indicates hepatotoxicity and requires liver function monitoring',correct:false,
   explain:'QT prolongation is a CARDIAC finding (delayed ventricular repolarisation), not hepatic. Wrong organ system entirely. Hepatotoxicity is detected by liver enzyme changes (ALT, AST elevation).'},
  {text:'QT prolongation predicts risk of torsades de pointes — a potentially fatal ventricular arrhythmia in humans',correct:true,
   explain:'QT interval = time from ventricular depolarisation to repolarisation. Prolongation (often via hERG potassium channel block) predisposes to TORSADES DE POINTES — polymorphic VT that can degenerate to ventricular fibrillation and sudden death. Many drugs withdrawn for this reason (terfenadine, cisapride). hERG assay is now standard preclinical screening. ICH E14 guidelines mandate thorough QT (TQT) studies in human Phase 1.'},
  {text:'QT prolongation only occurs in animals and rarely translates to humans',correct:false,
   explain:'BACKWARDS — drugs causing QT prolongation in dogs frequently cause it in humans (cardiac ion channels are highly conserved). hERG channel inhibition in vitro is even more predictive.'},
  {text:'QT prolongation is desirable in antiarrhythmic drugs and indicates clinical efficacy',correct:false,
   explain:'Class III antiarrhythmics DO prolong QT intentionally (amiodarone, sotalol) — but this is a NARROW class with strict monitoring. For most drug classes, QT prolongation = liability, not asset.'}
],
memory:'QT prolongation → hERG inhibition → Torsades de pointes risk → drugs withdrawn. Classic preclinical red flag.',
exam:'hERG IC₅₀ should be ≥30× the therapeutic Cmax. Closer margin = high concern.'},

{id:29,mod:'m4',type:'MCQ',
q:'Which ONE of the following is MOST critical for obtaining ethical approval for a Phase 1 trial?',
options:[
  {text:'Demonstrating commercial profitability through market analysis',correct:false,
   explain:'Commercial profitability is a SPONSOR concern, NOT an ethics committee concern. Ethics committees evaluate safety, scientific validity, informed consent, and equitable participant selection — not market potential.'},
  {text:'Adequate preclinical safety data supporting a no observed adverse effect level (NOAEL) and proposed starting human dose',correct:true,
   explain:'Ethics/regulatory IND approval requires: (1) Adequate preclinical safety package — acute, repeat-dose, genotoxicity, safety pharmacology. (2) Justified starting dose based on NOAEL with appropriate safety margins (typically 1/10 of human equivalent dose from most sensitive species). (3) Informed consent process. (4) Risk-benefit analysis. (5) Investigator qualifications. NOAEL = highest dose with no adverse effects in animal studies.'},
  {text:'Patent protection extending at least 20 years beyond trial completion',correct:false,
   explain:'Patent considerations are SPONSOR business issues, not ethics. Drugs without patent protection can still be tested ethically if they have scientific merit.'},
  {text:'Marketing authorisation from at least one major regulatory agency',correct:false,
   explain:'CIRCULAR — Phase 1 trials happen BEFORE marketing authorisation. You cannot require approval before doing the trials that lead to approval.'}
],
memory:'NOAEL → human starting dose (with 10× safety margin). Without adequate preclinical safety, no ethical Phase 1.',
exam:'TGN1412 disaster (2006) — UK Phase 1 trial caused cytokine storm in 6 healthy volunteers. Led to MABEL (minimum anticipated biological effect level) dosing for high-risk drug classes.'},

{id:30,mod:'m4',type:'MCQ',
q:'A drug shows promising efficacy in Phase 2 but fails Phase 3. Which ONE of the following BEST explains this common attrition?',
options:[
  {text:'Phase 3 patients receive lower doses than Phase 2 patients',correct:false,
   explain:'Phase 3 typically uses the dose RANGE established in Phase 2 — not lower. Dose selection is one of the things Phase 2 establishes.'},
  {text:'Phase 3 includes larger, more heterogeneous populations where efficacy signals may attenuate or unexpected adverse events emerge',correct:true,
   explain:'Phase 2 trials (100–300 patients) are smaller, more controlled, and include specifically selected patients more likely to respond. Phase 3 (1,000–5,000+) includes broader populations — different ages, comorbidities, concomitant medications, ethnicities, severity levels. Efficacy may be smaller in real-world populations. Rare adverse events (1 in 1,000+) become detectable. ~50% of drugs fail in Phase 3 despite Phase 2 promise.'},
  {text:'Regulatory agencies require different efficacy endpoints in Phase 3 than Phase 2',correct:false,
   explain:'Endpoints SHOULD be consistent between Phase 2 and 3 (Phase 2 selects the endpoints and effect size for Phase 3 power calculations). Endpoint changes between phases are a red flag.'},
  {text:'Phase 3 trials are not blinded, increasing placebo response',correct:false,
   explain:'OPPOSITE — Phase 3 trials are typically RIGOROUSLY blinded (double-blind, placebo-controlled). Strict blinding REVEALS the true treatment effect by controlling for placebo response.'}
],
memory:'Phase 2 efficacy in selected patients ≠ Phase 3 efficacy in broader populations. Heterogeneity attenuates signals.',
exam:'Phase 3 failures: insufficient efficacy (~50%), safety issues (~25%), strategic/commercial (~25%). Phase 3 is the most expensive part of development.'},
